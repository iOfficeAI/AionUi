<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        position: relative;
      }
      #pet {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #pet-atlas {
        position: absolute;
        left: 50%;
        bottom: 10%;
        width: 54%;
        aspect-ratio: 192 / 208;
        transform: translateX(-50%);
        background-repeat: no-repeat;
        background-size: 800% 900%;
      }
      #pet-atlas[hidden] {
        display: none;
      }
      #pet-notification-badge {
        position: absolute;
        top: 14%;
        right: 17%;
        z-index: 10;
        min-width: 24px;
        height: 24px;
        padding: 0 7px;
        border: 2px solid rgba(255, 255, 255, 0.92);
        border-radius: 999px;
        background: #ef4444;
        color: #ffffff;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
        font:
          700 12px/20px system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        text-align: center;
        box-sizing: border-box;
        pointer-events: none;
      }
      #pet-notification-badge[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <object id="pet" type="image/svg+xml" data="../pet-states/idle.svg"></object>
    <div id="pet-atlas" hidden></div>
    <div id="pet-notification-badge" hidden></div>
    <script type="module" src="./petRenderer.ts"></script>
  </body>
</html>
