<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自定义模型跨 Agent 切换 · 线框图</title>
<style>
  :root{
    /* 取自 AionUi default-color-scheme.css（亮色） */
    --bg-base:#ffffff; --bg-1:#f9fafb; --bg-2:#f2f3f5; --bg-3:#e5e6eb; --bg-4:#c9cdd4;
    --t1:#1d2129; --t2:#454d5f; --t3:#86909c; --t4:#c9cdd4;
    --border:#e5e6eb; --border-light:#f2f3f5;
    --aou-1:#eff0f6; --aou-2:#e5e7f0; --aou-6:#7583b2; --aou-7:#596590;
    --primary:#165dff; --primary-1:#e8f0ff; --primary-note-bg:#f0f4ff;
    --success:#00b42a; --warning:#ff7d00; --danger:#f53f3f;
    --msg-user:#e9efff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg-2); color:var(--t1); font-size:13px; line-height:1.5;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  .topbar{flex:0 0 auto;background:var(--bg-base);border-bottom:1px solid var(--border);}
  .topbar-row{display:flex;align-items:center;gap:8px;padding:8px 14px;}
  .topbar-row.phases{border-bottom:1px solid var(--border-light);}
  .doc-title{font-weight:600;font-size:13px;color:var(--aou-7);margin-right:8px;white-space:nowrap;}
  .feat-tabs{display:flex;align-items:center;gap:2px;padding:7px 14px;overflow-x:auto;}
  .feat-btn{flex:0 0 auto;border:none;background:transparent;cursor:pointer;padding:5px 10px;border-radius:7px;
    font-size:12px;color:var(--t3);white-space:nowrap;}
  .feat-btn:hover{background:var(--bg-2);}
  .feat-btn.on{background:var(--aou-1);color:var(--aou-7);font-weight:600;}
  .feat-btn .fc{font-family:ui-monospace,monospace;font-size:10.5px;opacity:.65;margin-right:4px;}

  .split{flex:1 1 auto;display:flex;min-height:0;}
  .left{flex:1 1 60%;min-width:0;overflow:auto;padding:24px;background:var(--bg-2);}
  .right{flex:0 0 40%;max-width:540px;min-width:0;overflow:auto;background:var(--bg-base);border-left:1px solid var(--border);padding:24px 26px;}
  .split.full .left{flex:1 1 100%;}
  .split.full .right{display:none;}
  @media(max-width:920px){.split{flex-direction:column;}.right{flex:none;max-width:none;border-left:none;border-top:1px solid var(--border);}}

  .req h2{font-size:17px;margin:3px 0 0;}
  .req .flags{margin:9px 0 16px;display:flex;gap:6px;}
  .badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500;}
  .badge.new{background:#e8f9ee;color:#0a8a2c;}
  .badge.mod{background:#fff3e0;color:#cc7000;}
  .req h3{font-size:12px;margin:20px 0 7px;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  .req p,.req li{font-size:13px;color:var(--t2);}
  .req ul{margin:6px 0;padding-left:18px;}
  .req li{margin-bottom:5px;}
  .story{background:var(--aou-1);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--t2);margin:2px 0 4px;}
  .story b{color:var(--aou-7);}
  .ac div{font-size:12.5px;color:var(--t2);padding:3px 0 3px 22px;position:relative;}
  .ac div:before{content:"";position:absolute;left:4px;top:8px;width:11px;height:11px;border:1.5px solid var(--t4);border-radius:3px;}
  .req table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12px;}
  .req th,.req td{border:1px solid var(--border);padding:6px 9px;text-align:left;vertical-align:top;}
  .req th{background:var(--bg-2);font-weight:600;}

  /* ===== App 外壳（贴近真实 AionUi） ===== */
  .app{position:relative;background:var(--bg-base);border:1px solid var(--border);border-radius:12px;overflow:hidden;
    box-shadow:0 4px 20px rgba(29,33,41,.08);max-width:960px;margin:0 auto;}
  .titlebar{height:34px;background:var(--bg-1);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:12px;}
  .tb-dots{display:flex;gap:7px;}
  .tb-dots i{width:11px;height:11px;border-radius:50%;display:block;}
  .tb-dots .r{background:#ff5f57;}.tb-dots .y{background:#febc2e;}.tb-dots .g{background:#28c840;}
  .tb-brand{flex:1;text-align:center;font-weight:600;font-size:12px;color:var(--t3);}
  .body{display:flex;height:580px;}
  .sider{flex:0 0 210px;background:var(--bg-1);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px 10px;}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;color:var(--aou-7);padding:4px 6px 12px;}
  .logo .sq{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--aou-6),var(--aou-7));}
  .snew{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600;color:#fff;
    background:var(--aou-6);cursor:pointer;margin-bottom:4px;}
  .ssearch{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;font-size:12.5px;color:var(--t3);cursor:pointer;border:1px solid var(--border);margin-bottom:10px;}
  .si-grp{font-size:11px;color:var(--t3);padding:8px 8px 4px;font-weight:600;}
  .si{height:34px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:9px;font-size:12.5px;color:var(--t2);cursor:pointer;}
  .si:hover{background:var(--bg-2);}
  .si.on{background:var(--bg-3);font-weight:600;color:var(--t1);}
  .si .di{width:18px;height:18px;border-radius:6px;background:var(--aou-1);display:flex;align-items:center;justify-content:center;font-size:11px;flex:0 0 auto;}
  .si-sp{flex:1;}
  .main{flex:1;min-width:0;background:var(--bg-base);overflow:hidden;position:relative;}

  /* 对话视图 */
  .conv{display:flex;flex-direction:column;height:100%;}
  .conv-h{flex:0 0 auto;height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border);}
  .conv-h .agent{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--t1);}
  .conv-h .agent .av{width:24px;height:24px;border-radius:7px;background:var(--aou-1);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .conv-h .sub{font-size:11px;color:var(--t3);font-weight:400;}
  .conv-h .sp{flex:1;}
  .conv-h .hdot{color:var(--t4);font-size:15px;}
  .conv-b{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;background:var(--bg-base);}
  .msg{font-size:12.5px;line-height:1.6;padding:9px 13px;border-radius:12px;max-width:78%;}
  .msg.u{align-self:flex-end;background:var(--msg-user);color:var(--t1);}
  .msg.a{align-self:flex-start;background:var(--bg-2);color:var(--t1);}
  .msg.sys{align-self:center;font-size:11px;color:var(--aou-7);background:var(--aou-1);border-radius:16px;padding:4px 12px;}
  /* 底部 composer / sendbox */
  .sendbox{flex:0 0 auto;margin:0 14px 14px;border:1px solid var(--border);border-radius:14px;background:var(--bg-base);
    box-shadow:0 2px 10px rgba(29,33,41,.04);display:flex;flex-direction:column;}
  .sb-input{padding:12px 14px 6px;font-size:12.5px;color:var(--t4);}
  .sb-tools{display:flex;align-items:center;gap:8px;padding:6px 10px 9px;}
  .sb-ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:14px;}
  .sb-sp{flex:1;}
  .sb-send{width:30px;height:30px;border-radius:9px;background:var(--aou-6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;}

  /* 模型选择 pill（Arco round Button, size small） */
  .model-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--bg-base);
    border-radius:100px;padding:5px 11px;font-size:12px;color:var(--t2);cursor:pointer;position:relative;white-space:nowrap;line-height:1;}
  .model-pill:hover{border-color:var(--aou-6);}
  .model-pill .brain{font-size:12px;color:var(--t3);}
  .model-pill .cur{font-weight:500;color:var(--t1);max-width:150px;overflow:hidden;text-overflow:ellipsis;}
  .model-pill .chev{color:var(--t3);font-size:9px;}

  /* Arco Dropdown Menu 风格 */
  .mdd{position:absolute;bottom:38px;right:0;width:288px;background:var(--bg-base);border:1px solid var(--border);
    border-radius:8px;box-shadow:0 8px 28px rgba(29,33,41,.16);z-index:20;overflow:hidden;padding:4px;}
  .mdd-grp{font-size:12px;color:var(--t3);font-weight:600;padding:8px 12px 5px;display:flex;align-items:center;gap:6px;}
  .mdd-grp .zone{margin-left:auto;font-weight:400;color:var(--t4);font-size:10.5px;}
  .mdd-sub{font-size:11px;color:var(--t3);padding:6px 12px 2px 26px;}
  .mdd-list{max-height:320px;overflow:auto;}
  .mdd-item{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--t1);}
  .mdd-item:hover{background:var(--bg-2);}
  .mdd-item.on{background:var(--bg-2);}
  .mdd-item .ck{width:16px;flex:0 0 auto;color:var(--primary);font-size:13px;text-align:center;}
  .mdd-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mdd-item .badge-ok{font-size:9px;color:var(--success);background:#e8f9ee;border-radius:6px;padding:1px 6px;font-weight:600;flex:0 0 auto;}
  .mdd-div{height:1px;background:var(--border-light);margin:4px 8px;}
  .mdd-empty{padding:14px 12px;font-size:11.5px;color:var(--t4);line-height:1.6;text-align:center;}
  .mdd-empty a{color:var(--primary);text-decoration:none;font-weight:500;}

  /* ===== 设置弹窗（880×459 modal 感） ===== */
  .modal-mask{position:absolute;inset:0;background:rgba(29,33,41,.35);display:flex;align-items:center;justify-content:center;}
  .modal{width:calc(100% - 40px);max-width:840px;height:490px;background:var(--bg-base);border-radius:16px;overflow:hidden;
    box-shadow:0 20px 56px rgba(29,33,41,.3);display:flex;flex-direction:column;}
  .modal-top{display:flex;align-items:center;padding:18px 22px 12px;}
  .modal-top .mt{font-size:17px;font-weight:600;color:var(--t1);}
  .modal-top .sp{flex:1;}
  .modal-top .mx{color:var(--t3);font-size:16px;cursor:pointer;}
  .modal-body{flex:1;display:flex;min-height:0;padding:0 22px 22px;gap:0;}
  .set-rail{flex:0 0 190px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--border);padding-right:12px;overflow:auto;}
  .rail-i{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;font-size:14px;color:var(--t2);cursor:pointer;font-weight:500;}
  .rail-i:hover{background:var(--bg-1);}
  .rail-i.on{background:var(--aou-2);color:var(--t1);}
  .rail-i .ri{width:16px;text-align:center;font-size:14px;color:var(--aou-7);}
  .set-content{flex:1;min-width:0;padding-left:22px;display:flex;flex-direction:column;overflow:hidden;}

  /* 模型页头部 */
  .mc-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .mc-title{font-size:20px;font-weight:600;color:var(--t1);line-height:34px;}
  .mc-head .sp{flex:1;}
  .mc-btn{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 14px;border-radius:100px;border:1px solid var(--border);
    background:var(--bg-base);font-size:12.5px;color:var(--t2);cursor:pointer;}
  .mc-btn:hover{color:var(--t1);border-color:var(--aou-6);}
  .mc-note{margin:12px 0 0;border:1px solid rgba(22,93,255,.32);background:rgba(22,93,255,.08);color:var(--primary);
    border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.5;}
  .mc-sep{border-bottom:1px solid var(--border);margin:14px 0;}
  .mc-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:2px;}

  /* Provider Collapse */
  .prov{border-radius:12px;overflow:hidden;background:var(--bg-2);}
  .prov-h{display:flex;align-items:center;gap:8px;min-height:32px;padding:9px 12px 9px 34px;background:var(--bg-base);position:relative;cursor:pointer;}
  .prov-h .caret{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:11px;}
  .prov.open .caret{transform:translateY(-50%) rotate(90deg);}
  .prov-h .pn{font-size:14px;font-weight:500;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prov-h .meter{font-size:12px;color:var(--t3);white-space:nowrap;}
  .prov-h .sp{flex:1;}
  .prov-h .toggle{width:32px;height:18px;border-radius:10px;background:var(--primary);position:relative;flex:0 0 auto;}
  .prov-h .toggle:after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;}
  .act{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:13px;cursor:pointer;}
  .act:hover{background:var(--bg-2);color:var(--t1);}
  .prov-c{border-top:1px solid var(--border);background:var(--bg-1);padding:8px 10px;display:none;}
  .prov.open .prov-c{display:block;}

  /* 模型行 */
  .mrow{display:flex;align-items:center;gap:10px;padding:11px 8px;}
  .mrow + .mrow{border-top:1px solid rgba(229,230,235,.7);}
  .mrow .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .mrow .dot.ok{background:var(--success);}
  .mrow .dot.bad{background:var(--danger);}
  .mrow .mn{font-size:14px;color:var(--t1);white-space:nowrap;}
  .mrow .tag{font-size:10px;border-radius:4px;padding:1px 7px;font-weight:500;}
  .tag.oai{background:#e8f9ee;color:#0a8a2c;} .tag.ant{background:#fff3e0;color:#cc7000;} .tag.gem{background:#e8f0ff;color:var(--primary);}
  .mrow .msw{width:32px;height:18px;border-radius:10px;background:var(--primary);position:relative;flex:0 0 auto;}
  .mrow .msw:after{content:"";position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;}
  .mrow .msw.off{background:var(--bg-4);} .mrow .msw.off:after{right:auto;left:2px;}
  .mrow .sp{flex:1;}
  /* F-MODEL-03：可用 Agent 图标 */
  .agent-flags{display:flex;align-items:center;gap:5px;}
  .aflag{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;position:relative;
    border:1px solid var(--border);background:var(--bg-base);}
  .aflag.ok{border-color:#b7ebc6;background:#f2fcf5;}
  .aflag.ok:after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:13px;height:13px;border-radius:50%;
    background:var(--success);color:#fff;font-size:8px;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;}
  .aflag.no{opacity:.3;filter:grayscale(1);}
  .aflag.testing{border-color:var(--warning);background:#fff7ed;}
  .aflag.testing:after{content:"…";position:absolute;right:-4px;bottom:-5px;width:13px;height:13px;border-radius:50%;
    background:var(--warning);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;line-height:1;}
  .mrow .hb{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:14px;cursor:pointer;background:var(--bg-base);}
  .mrow .hb:hover{background:var(--bg-2);color:var(--t1);}
  .mrow .btn-detect{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 11px;font-size:11.5px;color:var(--t2);
    border:1px solid var(--border);border-radius:100px;cursor:pointer;background:var(--bg-base);}
  .mrow .btn-detect:hover{border-color:var(--aou-6);color:var(--aou-7);}
  .btn-detect-all{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;font-size:11px;color:var(--primary);
    border:1px solid rgba(22,93,255,.3);border-radius:100px;cursor:pointer;background:rgba(22,93,255,.06);}

  /* 检测选择 Agent 弹层（居中，避免被裁） */
  .detect-stage{position:absolute;inset:0;background:rgba(29,33,41,.3);display:flex;align-items:center;justify-content:center;z-index:60;}
  .detect-pop{width:264px;background:var(--bg-base);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 50px rgba(29,33,41,.3);overflow:hidden;}
  .dp-h{font-size:12.5px;font-weight:600;color:var(--t1);padding:13px 15px 9px;border-bottom:1px solid var(--border-light);line-height:1.4;}
  .dp-item{display:flex;align-items:center;gap:9px;padding:9px 15px;font-size:13px;color:var(--t1);cursor:pointer;}
  .dp-item:hover{background:var(--bg-2);}
  .dp-item .ck{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--t4);display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;flex:0 0 auto;}
  .dp-item .ck.on{background:var(--primary);border-color:var(--primary);}
  .dp-f{padding:10px 15px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:8px;}
  .dp-btn{font-size:12px;background:var(--aou-6);color:#fff;border-radius:8px;padding:6px 15px;cursor:pointer;}
  .dp-btn.ghost{background:var(--bg-base);color:var(--t2);border:1px solid var(--border);}

  .legend{max-width:960px;margin:12px auto 0;font-size:11px;color:var(--t3);text-align:center;line-height:1.6;}

  /* overview */
  .ov{max-width:880px;margin:0 auto;}
  .ov h2{font-size:19px;margin:0 0 4px;}
  .ov .lead{color:var(--t3);font-size:13px;margin-bottom:20px;}
  .ov h3{font-size:14px;margin:22px 0 9px;color:var(--t1);border-left:3px solid var(--aou-6);padding-left:9px;}
  .ov table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12.5px;}
  .ov th,.ov td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top;}
  .ov th{background:var(--bg-2);font-weight:600;}
  .ov code{font-family:ui-monospace,monospace;background:var(--bg-2);padding:1px 5px;border-radius:4px;font-size:11.5px;color:var(--aou-7);}
  .erd{background:var(--bg-1);border:1px solid var(--border);border-radius:10px;padding:16px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.9;color:var(--t2);overflow:auto;}
  .erd b{color:var(--aou-7);}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-row phases"><a href="../index.html" style="font-size:13px;color:var(--aou-7);text-decoration:none;white-space:nowrap;">← 文档首页</a><span style="color:var(--border);">|</span><span class="doc-title">自定义模型跨 Agent 切换 · 线框图</span></div>
  <div class="feat-tabs" id="featTabs"></div>
</div>
<div class="split" id="split">
  <div class="left" id="left"></div>
  <div class="right" id="right"></div>
</div>

<script>
/* ===== App 外壳 ===== */
function shell(inner){
  return `<div class="app">
    <div class="titlebar"><span class="tb-dots"><i class="r"></i><i class="y"></i><i class="g"></i></span>
      <span class="tb-brand">AionUi</span><span style="width:40px;"></span></div>
    <div class="body">
      <div class="sider">
        <div class="logo"><span class="sq"></span>AionUi</div>
        <div class="snew">＋ 新建会话</div>
        <div class="ssearch">🔍 搜索会话…</div>
        <div class="si-grp">最近会话</div>
        <div class="si on"><span class="di">🤖</span>Claude Code</div>
        <div class="si"><span class="di">⚙️</span>Codex</div>
        <div class="si"><span class="di">🐦</span>AionCLI</div>
        <div class="si"><span class="di">💬</span>重构模块讨论</div>
        <div class="si-sp"></div>
        <div class="si"><span class="di">⚙️</span>设置</div>
      </div>
      <div class="main">${inner}</div>
    </div></div>`;
}

/* ===== 模型下拉：two-zone（Arco Menu 风格） ===== */
function modelDropdown(opt){
  opt=opt||{};
  let builtin='';
  if(opt.hasBuiltin){
    builtin = `<div class="mdd-grp">Agent 自带<span class="zone">${opt.agentName} 接口返回</span></div>

/* ===== 对话场景 ===== */
function sConv(opt){
  opt=opt||{};
  const curLabel = opt.curLabel || 'Claude Sonnet';
  const dd = opt.open ? modelDropdown(opt.dd||{}) : '';
  const inner = `<div class="conv">
    <div class="conv-h"><span class="agent"><span class="av">${opt.agentIcon||'🤖'}</span>${opt.agentName||'Claude Code'}
      ${opt.sub?`<span class="sub">· ${opt.sub}</span>`:''}</span><span class="sp"></span><span class="hdot">⋯</span></div>
    <div class="conv-b">
      ${opt.msgs||`<div class="msg u">帮我重构这个模块</div><div class="msg a">好的，我先读一下现有代码结构…</div>`}
    </div>
    <div class="sendbox">
      <div class="sb-input">输入消息，Enter 发送…</div>
      <div class="sb-tools">
        <span class="sb-ico">＋</span><span class="sb-ico">📎</span><span class="sb-ico">🖼️</span>
        <span class="sb-sp"></span>
        <span class="model-pill"><span class="brain">🧠</span><span class="cur">${curLabel}</span><span class="chev">▾</span>${dd}</span>
        <span class="sb-send">↑</span>
      </div>
    </div>
  </div>`;
  return shell(inner);
}

/* ===== 总览 ===== */
function sOverview(){
  return `<div class="ov">
    <h2>自定义模型跨 Agent 切换</h2>
    <div class="lead">在 AionUi 里配好自己的大模型（一套 Provider 设置）后，就能在各个 CLI Agent（首期 Claude Code、Codex）的模型下拉里直接选到、并真正用上——不必再借助外部的 CC Switch。</div>

    <h3>要解决的问题</h3>
    <p>用户在 AionUi 配的模型，<b>今天只有内置引擎能用</b>。切到 Claude Code、Codex 等 CLI Agent 时，模型下拉只有这些 Agent <b>自己内部配好的模型</b>，用户自配的模型进不来、选不了。用户只能另装一个 CC Switch 在外面配好再回来用。</p>

    <h3>核心概念一：两类模型，来源不同</h3>
    <table>
      <tr><th>类别</th><th>从哪来</th><th>举例</th></tr>
      <tr><td>Agent 自带模型</td><td>Agent 通过接口报上来的、它自己配好的（现状，保留）</td><td>Claude Code 的 Opus/Sonnet/Haiku</td></tr>
      <tr><td>我的模型</td><td>用户在「设置 → 模型」配的 Provider 模型（本期新增进下拉）</td><td>自配的 deepseek-v4-pro、glm-5.1x</td></tr>
    </table>

    <h3>核心概念二：一套下拉逻辑，覆盖所有 Agent</h3>
    <table>
      <tr><th>Agent</th><th>【Agent 自带】区</th><th>【我的模型】区</th><th>下拉呈现</th></tr>
      <tr><td>内置 AionCLI</td><td>无 → 隐藏</td><td>有</td><td>只显示「我的模型」</td></tr>
      <tr><td>Claude Code / Codex</td><td>有</td><td>有</td><td>两个区都显示</td></tr>
    </table>
    <p>规则：<b>某个区没有内容就整块隐藏，不留空标题。</b> AionCLI 只是「上区天然为空」的特例，验证了这是<b>统一的一套逻辑</b>。</p>
    <p style="color:var(--t3);">商业化前瞻（非本期）：未来内置的付费官方模型将归入某 Agent 的【Agent 自带】区，现有结构已能容纳。</p>

    <h3>核心概念三：借鉴 CC Switch，但更进一步</h3>
    <p>CC Switch 切换的是<b>「一整套连接配置」</b>（去哪个地址、用哪个密钥），<b>不切具体模型</b>。AionUi 的 Provider 本就带明确的模型列表，所以我们能做到 CC Switch 做不到的一步：<b>让用户在下拉里直接点选一个具体的自定义模型</b>。</p>

    <h3>核心概念四：可用性是「验证过的」，不是「猜的」</h3>
    <p>不去猜兼容性、不自动过滤，而是让用户在模型列表里<b>主动检测</b>（真跑一次），通过的 Agent 用<b>图标点亮</b>。图标 = <b>最近一次检测通过</b>，可随时重测——不是终身保证。</p>

    <h3>实体关系</h3>
    <div class="erd"><b>PROVIDER</b> ||--o{ <b>MODEL</b> : 配置多个模型
<b>AGENT</b> ||--o{ <b>AGENT_BUILTIN_MODEL</b> : 接口返回自带模型（AionCLI 为空）
<b>AGENT</b> ||--o| <b>SELECTED_MODEL</b> : 当前对话选中一个
<b>SELECTED_MODEL</b> }o--|| <b>MODEL</b> : 可来自「我的模型」
<b>SELECTED_MODEL</b> }o--|| <b>AGENT_BUILTIN_MODEL</b> : 或来自 Agent 自带
<b>MODEL</b> ||--o{ <b>AVAILABILITY_CHECK</b> : 对各 Agent 的检测结果</div>
  </div>`;
}

function renderReq(r){
  if(!r) return '';
  const badge = r.kind==='新增' ? '<span class="badge new">新增</span>' : '<span class="badge mod">改造</span>';
  let h=`<div class="req"><h2>${r.title}</h2><div class="flags">${badge}</div>`;
  if(r.story) h+=`<div class="story">${r.story}</div>`;
  if(r.now) h+=`<h3>现状</h3><p>${r.now}</p>`;
  h+=`<h3>需求</h3><ul>`+r.need.map(n=>`<li>${n}</li>`).join('')+`</ul>`;
  if(r.flow){h+=`<h3>正常流程</h3><ul>`+r.flow.map((f,i)=>`<li>${i+1}. ${f}</li>`).join('')+`</ul>`;}
  if(r.exc){h+=`<h3>异常情况</h3><ul>`+r.exc.map(e=>`<li>${e}</li>`).join('')+`</ul>`;}
  if(r.note){h+=`<div class="story" style="background:var(--bg-1);color:var(--t3);">⚙ ${r.note}</div>`;}
  h+=`<h3>验收标准</h3><div class="ac">`+r.ac.map(a=>`<div>${a}</div>`).join('')+`</div></div>`;
  return h;
}

const tabsEl=document.getElementById('featTabs');
const splitEl=document.getElementById('split');
const leftEl=document.getElementById('left');
const rightEl=document.getElementById('right');
let cur='ov';
function build(){
  tabsEl.innerHTML=FEATS.map(f=>`<button class="feat-btn ${f.id===cur?'on':''}" data-id="${f.id}">
    ${f.code?`<span class="fc">${f.code}</span>`:''}${f.name}</button>`).join('');
  tabsEl.querySelectorAll('.feat-btn').forEach(b=>b.onclick=()=>{cur=b.dataset.id;build();});
  const f=FEATS.find(x=>x.id===cur);
  leftEl.innerHTML=f.render();
  if(f.full){splitEl.classList.add('full');rightEl.innerHTML='';}
  else{splitEl.classList.remove('full');rightEl.innerHTML=renderReq(f.req);}
}
build();
</script>
</body>
</html>
