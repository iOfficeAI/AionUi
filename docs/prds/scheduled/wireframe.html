<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定时任务优化 · 线框图</title>
<style>
  :root{
    --bg-base:#ffffff; --bg-1:#f9fafb; --bg-2:#f2f3f5; --bg-3:#e5e6eb;
    --t1:#1d2129; --t2:#454d5f; --t3:#86909c; --t4:#c9cdd4;
    --border:#e5e6eb; --border-light:#f2f3f5;
    --aou-1:#eff0f6; --aou-2:#e5e7f0; --aou-6:#7583b2; --aou-7:#596590;
    --primary:#165dff; --success:#00b42a; --warning:#ff7d00; --danger:#f53f3f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg-2); color:var(--t1); font-size:13px; line-height:1.5;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;}

  .topbar{flex:0 0 auto;background:var(--bg-base);border-bottom:1px solid var(--border);}
  .topbar-row{display:flex;align-items:center;gap:8px;padding:8px 14px;}
  .topbar-row.phases{border-bottom:1px solid var(--border-light);}
  .doc-title{font-weight:600;font-size:13px;color:var(--aou-7);margin-right:8px;white-space:nowrap;}
  .feat-tabs{display:flex;align-items:center;gap:2px;padding:7px 14px;overflow-x:auto;}
  .feat-btn{flex:0 0 auto;border:none;background:transparent;cursor:pointer;padding:5px 10px;border-radius:7px;
    font-size:12px;color:var(--t3);white-space:nowrap;}
  .feat-btn:hover{background:var(--bg-2);}
  .feat-btn.on{background:var(--aou-1);color:var(--aou-7);font-weight:600;}
  .feat-btn .fc{font-family:ui-monospace,monospace;font-size:10.5px;opacity:.65;margin-right:4px;}
  .feat-btn .bug{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--danger);margin-right:4px;vertical-align:middle;}
  .feat-btn .st{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px;vertical-align:middle;}
  .feat-btn .st.done{background:var(--success);}
  .feat-btn .st.partial{background:var(--warning);}
  .feat-btn .st.todev{background:var(--t4);}
  .statusline{display:flex;align-items:center;gap:8px;font-size:12px;margin:2px 0 10px;padding:8px 12px;border-radius:9px;font-weight:600;}
  .statusline.done{background:#e8f9ee;color:#0a8a2c;}
  .statusline.partial{background:#fff8f0;color:#cc7000;}
  .statusline.todev{background:var(--bg-2);color:var(--t3);}
  .statusline .sd{font-weight:400;font-size:11.5px;opacity:.9;}

  .split{flex:1 1 auto;display:flex;min-height:0;}
  .left{flex:1 1 60%;min-width:0;overflow:auto;padding:24px;background:var(--bg-2);}
  .right{flex:0 0 40%;max-width:540px;min-width:0;overflow:auto;background:var(--bg-base);border-left:1px solid var(--border);padding:24px 26px;}
  .split.full .left{flex:1 1 100%;}
  .split.full .right{display:none;}
  @media(max-width:920px){.split{flex-direction:column;}.right{flex:none;max-width:none;border-left:none;border-top:1px solid var(--border);}}

  .req .fcode{font-family:ui-monospace,monospace;font-size:12px;color:var(--aou-6);font-weight:600;}
  .req h2{font-size:17px;margin:3px 0 0;}
  .req .flags{margin:9px 0 16px;display:flex;gap:6px;}
  .badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500;}
  .badge.new{background:#e8f9ee;color:#0a8a2c;}
  .badge.bug{background:#ffece8;color:#d4380d;}
  .badge.opt{background:#eef2ff;color:#4959a8;}
  .badge.db{background:#fff3e0;color:#cc7000;}
  .req h3{font-size:12px;margin:20px 0 7px;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  .req p,.req li{font-size:13px;color:var(--t2);}
  .req ul{margin:6px 0;padding-left:18px;}
  .req li{margin-bottom:5px;}
  .story{background:var(--aou-1);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--t2);margin:2px 0 4px;}
  .story b{color:var(--aou-7);}
  .ac div{font-size:12.5px;color:var(--t2);padding:3px 0 3px 22px;position:relative;}
  .ac div:before{content:"";position:absolute;left:4px;top:8px;width:11px;height:11px;border:1.5px solid var(--t4);border-radius:3px;}
  .disc{background:#fff8f0;border:1px solid #ffe0b3;border-radius:9px;padding:10px 13px;font-size:12.5px;color:#8a5a00;margin:6px 0;}
  .disc b{color:#cc7000;}

  .app{position:relative;background:var(--bg-base);border:1px solid var(--border);border-radius:14px;overflow:hidden;
    box-shadow:0 4px 20px rgba(29,33,41,.06);max-width:940px;margin:0 auto;}
  .titlebar{height:36px;background:var(--bg-2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:12px;}
  .tb-dots{display:flex;gap:7px;}
  .tb-dots i{width:11px;height:11px;border-radius:50%;display:block;}
  .tb-dots .r{background:#ff5f57;}.tb-dots .y{background:#febc2e;}.tb-dots .g{background:#28c840;}
  .tb-ico{color:var(--t3);font-size:14px;}
  .tb-brand{flex:1;text-align:center;font-weight:600;font-size:12.5px;color:var(--t2);}
  .body{display:flex;height:560px;}
  .sider{flex:0 0 190px;background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px 8px;}
  .logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;color:var(--aou-7);padding:5px 8px 12px;}
  .logo .sq{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--aou-6),var(--aou-7));}
  .si{height:32px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--t2);cursor:pointer;font-weight:500;position:relative;}
  .si:hover{background:var(--bg-3);}
  .si.on{background:var(--bg-3);font-weight:600;color:var(--t1);}
  .si .di{width:18px;text-align:center;font-size:14px;color:var(--t3);}
  .si-div{height:1px;background:var(--border);margin:8px 6px;}
  .si-grp{font-size:11px;color:var(--t3);padding:10px 10px 3px;font-weight:600;}
  .si-sp{flex:1;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);display:inline-block;}
  .dot-abs{position:absolute;right:10px;top:12px;}
  .main{flex:1;min-width:0;overflow:hidden;display:flex;flex-direction:column;}

  /* 通用页头 */
  .page-h{flex:0 0 auto;height:46px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;padding:0 16px;}
  .page-h .bk{color:var(--aou-7);cursor:pointer;font-size:13px;}
  .page-h .tt{font-weight:600;font-size:14px;}
  .page-h .sp{flex:1;}
  .page-b{flex:1;overflow:auto;padding:16px;background:var(--bg-1);}

  .btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--bg-base);
    border-radius:8px;padding:6px 13px;font-size:12.5px;color:var(--t1);cursor:pointer;white-space:nowrap;}
  .btn:hover{background:var(--bg-1);}
  .btn.pri-b{background:var(--aou-6);border-color:var(--aou-6);color:#fff;}
  .btn.sm{padding:4px 10px;font-size:12px;border-radius:6px;}
  .btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;}

  /* 聚合页任务卡网格 */
  .jgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .jcard{background:var(--bg-base);border:1px solid var(--border);border-radius:11px;padding:13px 15px;cursor:pointer;position:relative;}
  .jcard:hover{border-color:var(--aou-6);box-shadow:0 2px 10px rgba(117,131,178,.1);}
  .jcard .jt{font-size:13.5px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:7px;}
  .jcard .jmeta{font-size:11.5px;color:var(--t3);line-height:1.7;}
  .jcard .jstate{position:absolute;top:12px;right:13px;font-size:10px;padding:2px 8px;border-radius:9px;font-weight:600;}
  .jstate.active{background:#e8f9ee;color:#0a8a2c;}
  .jstate.paused{background:var(--bg-2);color:var(--t3);}

  /* 详情页 */
  .dsec{background:var(--bg-base);border:1px solid var(--border);border-radius:11px;padding:14px 16px;margin-bottom:12px;}
  .dsec h4{font-size:12px;margin:0 0 9px;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  .drow{display:flex;font-size:12.5px;padding:4px 0;}
  .drow .dk{flex:0 0 92px;color:var(--t3);}
  .drow .dv{color:var(--t2);}
  .conv-list-h{display:flex;align-items:center;gap:9px;margin-bottom:9px;}
  .conv-list-h .clt{font-size:12px;color:var(--t3);text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  .conv-list-h .sp{flex:1;}
  .crow{display:flex;align-items:center;gap:10px;background:var(--bg-base);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:7px;}
  .crow:hover{border-color:var(--t4);}
  .crow .chk{width:15px;height:15px;border:1.5px solid var(--t4);border-radius:4px;flex:0 0 auto;}
  .crow .chk.on{background:var(--aou-6);border-color:var(--aou-6);position:relative;}
  .crow .chk.on:after{content:"✓";color:#fff;font-size:10px;position:absolute;left:2px;top:-1px;}
  .crow .cnm{font-size:12.5px;color:var(--t1);flex:1;}
  .crow .ctime{font-size:11px;color:var(--t4);font-family:ui-monospace,monospace;}
  .crow.sel{background:var(--aou-1);border-color:var(--aou-6);}
  .batchbar{display:flex;align-items:center;gap:10px;background:var(--aou-1);border:1px solid var(--aou-2);border-radius:9px;padding:8px 13px;margin-bottom:10px;font-size:12.5px;color:var(--aou-7);}
  .batchbar .sp{flex:1;}

  /* 对话页（对话内创建 / 标题） */
  .conv-wrap{display:flex;height:100%;flex-direction:column;}
  .conv-h{flex:0 0 auto;height:42px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;padding:0 14px;font-size:13px;}
  .conv-h .av{width:22px;height:22px;border-radius:6px;background:var(--aou-1);display:flex;align-items:center;justify-content:center;font-size:12px;}
  .conv-h .nm{font-weight:600;}
  .conv-b{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:11px;}
  .msg{max-width:84%;font-size:12px;line-height:1.55;padding:8px 11px;border-radius:11px;white-space:pre-line;}
  .msg.u{align-self:flex-end;background:var(--aou-6);color:#fff;border-bottom-right-radius:4px;}
  .msg.a{align-self:flex-start;background:var(--bg-2);color:var(--t1);border-bottom-left-radius:4px;}
  .sysline{align-self:center;font-size:11px;color:var(--aou-7);background:var(--aou-1);border:1px solid var(--aou-2);
    border-radius:18px;padding:5px 12px;display:flex;align-items:center;gap:6px;max-width:94%;}
  .sysline.ok{color:#0a8a2c;background:#e8f9ee;border-color:#c5ecd0;}
  .sysline .si2{font-size:12px;}
  .task-recap{align-self:center;background:var(--bg-base);border:1px solid var(--border);border-radius:11px;padding:11px 14px;max-width:94%;font-size:12px;}
  .task-recap .trh{font-weight:600;color:var(--aou-7);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .task-recap .trrow{display:flex;padding:2px 0;}
  .task-recap .trk{flex:0 0 66px;color:var(--t3);}
  .task-recap .trv{color:var(--t2);white-space:pre-line;}

  /* 会话列表（侧栏内含定时任务会话回归普通列表） */
  .si-sub{font-size:12px;color:var(--t2);padding:5px 10px 5px 22px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:7px;position:relative;}
  .si-sub:hover{background:var(--bg-3);}
  .si-clock{font-size:11px;opacity:.7;}

  /* 空状态 */
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:30px 22px;color:var(--t3);}
  .empty .ei{font-size:32px;margin-bottom:12px;opacity:.5;}
  .empty .eh{font-size:13.5px;color:var(--t2);font-weight:600;margin-bottom:6px;}
  .empty .ed{font-size:12px;color:var(--t4);max-width:280px;line-height:1.6;}

  /* 弹窗 */
  .modal-stage{position:absolute;inset:0;background:rgba(29,33,41,.28);display:flex;align-items:center;justify-content:center;padding:24px;}
  .modal{width:100%;max-width:380px;background:var(--bg-base);border-radius:14px;border:1px solid var(--border);overflow:hidden;box-shadow:0 16px 48px rgba(29,33,41,.22);}
  .modal-h{padding:16px 18px 4px;font-weight:600;font-size:15px;}
  .modal-b{padding:8px 18px 12px;}
  .modal-b p{font-size:12.5px;color:var(--t2);margin:6px 0;}
  .flabel{font-size:11.5px;font-weight:600;color:var(--t2);margin:11px 0 5px;}
  .flabel:first-child{margin-top:0;}
  .flabel .opt{color:var(--t4);font-weight:400;}
  .finput{border:1px solid var(--border);border-radius:8px;padding:8px 11px;font-size:12.5px;color:var(--t3);}
  .modal-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px;}

  /* overview */
  .ov{max-width:880px;margin:0 auto;}
  .ov h2{font-size:19px;margin:0 0 4px;}
  .ov .lead{color:var(--t3);font-size:13px;margin-bottom:20px;}
  .ov h3{font-size:14px;margin:22px 0 9px;color:var(--t1);border-left:3px solid var(--aou-6);padding-left:9px;}
  .ov table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12.5px;}
  .ov th,.ov td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top;}
  .ov th{background:var(--bg-2);font-weight:600;}
  .ov code{font-family:ui-monospace,monospace;background:var(--bg-2);padding:1px 5px;border-radius:4px;font-size:11.5px;color:var(--aou-7);}
  .ov .tagb{display:inline-block;font-size:10px;padding:1px 7px;border-radius:8px;font-weight:600;}
  .ov .tagb.bug{background:#ffece8;color:#d4380d;}
  .ov .tagb.opt{background:#eef2ff;color:#4959a8;}
  .ov .tagb.dn{background:#e8f9ee;color:#0a8a2c;}
  .ov .tagb.par{background:#fff3e0;color:#cc7000;}
  .ov .tagb.td{background:var(--bg-2);color:var(--t3);}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-row phases"><a href="../../index.html" style="font-size:13px;color:var(--aou-7);text-decoration:none;white-space:nowrap;">← 文档首页</a><span style="color:var(--border);">|</span><span class="doc-title">定时任务优化 · 线框图</span></div>
  <div class="feat-tabs" id="featTabs"></div>
</div>
<div class="split" id="split">
  <div class="left" id="left"></div>
  <div class="right" id="right"></div>
</div>

<script>
/* ====== 外壳 ======
   opt.siderUnread: 侧栏「定时任务」入口是否带蓝点
   opt.cronConvInList: 定时任务会话是否回归普通会话列表
*/
function shell(inner,opt){
  opt=opt||{};
  const unread = opt.siderUnread ? '<span class="dot dot-abs"></span>' : '';
  const cronInList = opt.cronConvInList ? `
        <div class="si-sub"><span class="si-clock">⏰</span>日报汇总 01-07-26</div>
        <div class="si-sub"><span class="si-clock">⏰</span>日报汇总 30-06-26</div>` : '';
  return `<div class="app">
    <div class="titlebar"><span class="tb-dots"><i class="r"></i><i class="y"></i><i class="g"></i></span>
      <span class="tb-ico">☰</span><span class="tb-brand">AionUi</span><span class="tb-ico">⤢</span></div>
    <div class="body">
      <div class="sider"><div class="logo"><span class="sq"></span>AionUi</div>
        <div class="si"><span class="di">＋</span>新建会话</div>
        <div class="si"><span class="di">🔍</span>搜索</div>
        <div class="si-div"></div>
        <div class="si ${opt.scheduledOn?'on':''}"><span class="di">⏰</span>定时任务${unread}</div>
        <div class="si-div"></div>
        <div class="si-grp">📁 AionUi 工作区</div>
        <div class="si-sub">重构方案讨论</div>
        ${cronInList}
        <div class="si-sub">修复登录 bug</div>
        <div class="si-sp"></div>
        <div class="si"><span class="di">⚙️</span>设置</div>
      </div>
      <div class="main">${inner}</div></div></div>`;
}

/* ====== 聚合页 ====== */
function sAgg(opt){
  opt=opt||{};
  const c1dot = opt.card1Unread ? '<span class="dot"></span>' : '';
  const inner=`<div class="conv-wrap"><div style="height:100%;display:flex;flex-direction:column;">
    <div class="page-h"><span class="tt">⏰ 定时任务</span><span class="sp"></span>
      <span class="btn sm pri-b">＋ 新建定时任务</span></div>
    <div class="page-b">
      <div class="jgrid">
        <div class="jcard"><span class="jstate active">运行中</span>
          <div class="jt">${c1dot}每日邮件日报</div>
          <div class="jmeta">每天 09:00 · 下次 明天 09:00<br>助手：邮件管家 · 每次新建会话</div></div>
        <div class="jcard"><span class="jstate active">运行中</span>
          <div class="jt">周报草稿生成</div>
          <div class="jmeta">每周一 18:00 · 下次 周一 18:00<br>助手：写作助手 · 延用同一会话</div></div>
        <div class="jcard"><span class="jstate paused">已暂停</span>
          <div class="jt">竞品动态巡检</div>
          <div class="jmeta">每天 20:00 · 已暂停<br>助手：调研助手 · 每次新建会话</div></div>
        <div class="jcard"><span class="jstate active">运行中</span>
          <div class="jt">依赖更新检查</div>
          <div class="jmeta">每周五 10:00 · 下次 周五 10:00<br>助手：开发助手 · 每次新建会话</div></div>
      </div>
    </div>
  </div></div>`;
  return shell(inner,{scheduledOn:true,siderUnread:opt.card1Unread});
}

/* ====== 详情页 ====== */
function sDetail(opt){
  opt=opt||{};
  const convDot = (i)=> (opt.convUnread && i===0) ? '<span class="dot"></span>' : '';
  const batch = opt.batch;
  const sel = opt.selected||[];
  const chk = (i)=> batch ? `<div class="chk ${sel.includes(i)?'on':''}"></div>` : '';
  const rowCls=(i)=> (batch && sel.includes(i)) ? 'crow sel' : 'crow';
  const convs=[
    ['日报汇总 01-07-26','01-07 09:00'],
    ['日报汇总 30-06-26','30-06 09:00'],
    ['日报汇总 29-06-26','29-06 09:00'],
    ['日报汇总 28-06-26','28-06 09:00'],
  ];
  const listHead = batch
    ? `<div class="batchbar"><span>已选 ${sel.length} 项</span><span class="sp"></span>
        <span class="btn sm">全选</span><span class="btn sm danger">🗑 删除所选</span><span class="btn sm">取消</span></div>`
    : `<div class="conv-list-h"><span class="clt">执行记录（会话）</span><span class="sp"></span>
        <span class="btn sm">多选</span></div>`;
  const rows = convs.map((c,i)=>`<div class="${rowCls(i)}">${chk(i)}
      <span class="cnm">${convDot(i)}${c[0]}</span><span class="ctime">${c[1]}</span></div>`).join('');
  const inner=`<div class="conv-wrap"><div style="height:100%;display:flex;flex-direction:column;">
    <div class="page-h"><span class="bk">← 定时任务</span><span class="tt">每日邮件日报</span><span class="sp"></span>
      <span class="btn sm">立即执行</span><span class="btn sm">编辑</span></div>
    <div class="page-b">
      <div class="dsec"><h4>配置</h4>
        <div class="drow"><span class="dk">执行时间</span><span class="dv">每天 09:00（下次 明天 09:00）</span></div>
        <div class="drow"><span class="dk">助手</span><span class="dv">邮件管家</span></div>
        <div class="drow"><span class="dk">执行方式</span><span class="dv">每次新建会话</span></div>
        <div class="drow"><span class="dk">工作目录</span><span class="dv">~/work/daily-report</span></div>
        <div class="drow"><span class="dk">描述</span><span class="dv" style="color:var(--t4);">（未填写）</span></div>
      </div>
      ${listHead}
      ${rows}
    </div>
  </div></div>`;
  return shell(inner,{scheduledOn:true,siderUnread:opt.convUnread});
}

/* ====== 对话内创建 ====== */

/* ====== 渲染右侧需求 ====== */
const TYPE_BADGE={bug:['badge bug','Bug 修复'],opt:['badge opt','优化'],db:['badge db','优化 · 动 DB']};
const STATUS_TEXT={done:'✅ 已完成（2.1.27）',partial:'🟡 部分完成（2.1.27）',todev:'⬜ 待开发'};
function renderReq(r,feat){
  if(!r) return '';
  const tb=TYPE_BADGE[r.type]||['badge new','新增'];
  let h=`<div class="req"><h2>${r.title}</h2><div class="flags"><span class="${tb[0]}">${tb[1]}</span></div>`;
  if(feat&&feat.status){
    h+=`<div class="statusline ${feat.status}"><span>${STATUS_TEXT[feat.status]||''}</span>${feat.statusNote?`<span class="sd">· ${feat.statusNote}</span>`:''}</div>`;
  }
  if(r.story) h+=`<div class="story">${r.story}</div>`;
  if(r.now) h+=`<h3>现状</h3><p>${r.now}</p>`;
  h+=`<h3>需求</h3><ul>`+r.need.map(n=>`<li>${n}</li>`).join('')+`</ul>`;
  if(r.flow){h+=`<h3>正常流程</h3><ul>`+r.flow.map((f,i)=>`<li>${i+1}. ${f}</li>`).join('')+`</ul>`;}
  if(r.exc){h+=`<h3>异常情况</h3><ul>`+r.exc.map(e=>`<li>${e}</li>`).join('')+`</ul>`;}
  if(r.disc){h+=`<h3>待讨论 / 影响范围</h3><div class="disc">${r.disc}</div>`;}
  h+=`<h3>验收标准</h3><div class="ac">`+r.ac.map(a=>`<div>${a}</div>`).join('')+`</div></div>`;
  return h;
}

/* ====== 控制器 ====== */
const tabsEl=document.getElementById('featTabs');
const splitEl=document.getElementById('split');
const leftEl=document.getElementById('left');
const rightEl=document.getElementById('right');
let cur='ov';
function build(){
  tabsEl.innerHTML=FEATS.map(f=>`<button class="feat-btn ${f.id===cur?'on':''}" data-id="${f.id}">
    ${f.type==='bug'?'<span class="bug"></span>':''}${f.code?`<span class="fc">${f.code}</span>`:''}${f.name}${f.status?`<span class="st ${f.status}"></span>`:''}</button>`).join('');
  tabsEl.querySelectorAll('.feat-btn').forEach(b=>b.onclick=()=>{cur=b.dataset.id;build();});
  const f=FEATS.find(x=>x.id===cur);
  leftEl.innerHTML=f.render();
  if(f.full){splitEl.classList.add('full');rightEl.innerHTML='';}
  else{splitEl.classList.remove('full');rightEl.innerHTML=renderReq(f.req,f);}
}
build();
</script>
