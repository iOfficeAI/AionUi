[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campus-tools-contract-scan"
version = "1.0.0"
description = "Campus Rule Decoder - Contract Scan Tool (Chinese Version)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "openai>=1.0",
    "pdfplumber>=0.10",
    "python-docx>=1.0",
    "pydantic>=2.0",
    "jmespath>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["contractguard"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# HTML fragments and long prompt strings would be worse if wrapped.
"contractguard/web.py" = ["E501"]
"contractguard/prompts.py" = ["E501"]
"contractguard/report.py" = ["E501"]
