<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .t-body { transform-origin: 11px 14px; animation: t-tilt 2.5s ease-in-out infinite; }
      .t-dot1 { animation: t-pop 1.8s ease-in-out infinite; }
      .t-dot2 { animation: t-pop 1.8s ease-in-out .4s infinite; }
      .t-dot3 { animation: t-pop 1.8s ease-in-out .8s infinite; }
      @keyframes t-tilt  { 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2deg)} }
      @keyframes t-pop   { 0%,60%,100%{opacity:.3;transform:scale(.7)} 30%{opacity:1;transform:scale(1)} }
    </style>
  </defs>
  <g class="t-body">
    <!-- wings -->
    <polygon points="7,13 1,18 7,20" fill="#3a7a44"/>
    <polygon points="15,13 21,18 15,20" fill="#3a7a44"/>
    <!-- tail -->
    <path d="M13 20 Q17 22 15 25 Q12 24 13 21" fill="#3a7a44"/>
    <!-- body -->
    <ellipse cx="11" cy="16" rx="5" ry="4.5" fill="#4e9e5a"/>
    <ellipse cx="11" cy="16.5" rx="3" ry="2.8" fill="#7fbf8a"/>
    <rect x="9" y="10.5" width="4" height="3" rx="1.5" fill="#4e9e5a"/>
    <!-- head tilted up-left -->
    <circle cx="11" cy="8.5" r="5" fill="#4e9e5a"/>
    <polygon points="8.5,4.5 9.5,1.5 11,4.5" fill="#ff7043"/>
    <polygon points="11,4.5 12.5,1.5 13.5,4.5" fill="#ff7043"/>
    <ellipse cx="11" cy="11" rx="2.2" ry="1.3" fill="#3a7a44"/>
    <circle cx="10.2" cy="11" r=".4" fill="#2d5e35"/>
    <circle cx="11.8" cy="11" r=".4" fill="#2d5e35"/>
    <!-- eyes looking up -->
    <circle cx="9" cy="8" r="2" fill="#f0f0f0"/>
    <circle cx="13" cy="8" r="2" fill="#f0f0f0"/>
    <circle cx="9" cy="6.8" r="1.1" fill="#111827"/>
    <circle cx="13" cy="6.8" r="1.1" fill="#111827"/>
    <circle cx="9.4" cy="6.4" r=".35" fill="white"/>
    <circle cx="13.4" cy="6.4" r=".35" fill="white"/>
    <!-- neutral mouth -->
    <path d="M9.5 12.8 Q11 13.5 12.5 12.8" stroke="#2d5e35" stroke-width=".8" stroke-linecap="round" fill="none"/>
  </g>
  <!-- thought dots -->
  <circle class="t-dot1" cx="17" cy="2" r="1" fill="#97c4a0"/>
  <circle class="t-dot2" cx="20" cy="-2" r="1.4" fill="#97c4a0"/>
  <circle class="t-dot3" cx="23" cy="-6" r="1.8" fill="#97c4a0"/>
</svg>
