<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .y-body { transform-origin: 11px 14px; animation: y-tilt 3s ease-in-out infinite; }
      @keyframes y-tilt { 0%,100%{transform:rotate(0)} 30%,70%{transform:rotate(-3deg)} }
    </style>
  </defs>
  <g class="y-body">
    <polygon points="7,13 0,18 7,20" fill="#3a7a44" opacity=".8"/>
    <polygon points="15,13 22,18 15,20" fill="#3a7a44" opacity=".8"/>
    <path d="M13 20 Q17 22 15 25 Q12 24 13 21" fill="#3a7a44"/>
    <ellipse cx="11" cy="16" rx="5" ry="4.5" fill="#4e9e5a"/>
    <ellipse cx="11" cy="16.5" rx="3" ry="2.8" fill="#7fbf8a"/>
    <rect x="9" y="10.5" width="4" height="3" rx="1.5" fill="#4e9e5a"/>
    <circle cx="11" cy="8.5" r="5" fill="#4e9e5a"/>
    <polygon points="8.5,4.5 9.5,1.5 11,4.5" fill="#ff7043"/>
    <polygon points="11,4.5 12.5,1.5 13.5,4.5" fill="#ff7043"/>
    <!-- half closed eyes -->
    <circle cx="9" cy="8.5" r="2" fill="#f0f0f0"/>
    <circle cx="13" cy="8.5" r="2" fill="#f0f0f0"/>
    <ellipse cx="9" cy="9" rx="1.1" ry=".7" fill="#111827"/>
    <ellipse cx="13" cy="9" rx="1.1" ry=".7" fill="#111827"/>
    <!-- eyelids half-closed -->
    <path d="M7.2 7.8 Q9 8.8 10.8 7.8" stroke="#4e9e5a" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M11.2 7.8 Q13 8.8 14.8 7.8" stroke="#4e9e5a" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <!-- wide yawn mouth -->
    <ellipse cx="11" cy="12.5" rx="2.5" ry="2" fill="#2d5e35"/>
    <ellipse cx="11" cy="12.5" rx="1.8" ry="1.4" fill="#1a3d22"/>
    <!-- snout (override position) -->
    <ellipse cx="11" cy="11" rx="2.2" ry="1.3" fill="#3a7a44"/>
    <circle cx="10.2" cy="11" r=".4" fill="#2d5e35"/>
    <circle cx="11.8" cy="11" r=".4" fill="#2d5e35"/>
  </g>
</svg>
