<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .dz-body { transform-origin: 11px 16px; animation: dz-sag 5s ease-in-out infinite; }
      .dz-z { animation: dz-fade 2.5s ease-in-out infinite; }
      @keyframes dz-sag  { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(1px) rotate(-2deg)} }
      @keyframes dz-fade { 0%,100%{opacity:.4} 50%{opacity:1} }
    </style>
  </defs>
  <g class="dz-body">
    <polygon points="7,14 2,19 7,21" fill="#3a7a44" opacity=".6"/>
    <polygon points="15,14 20,19 15,21" fill="#3a7a44" opacity=".6"/>
    <path d="M13 20 Q17 22 15 25 Q12 24 13 21" fill="#3a7a44"/>
    <ellipse cx="11" cy="17" rx="5.5" ry="4" fill="#4e9e5a"/>
    <ellipse cx="11" cy="17.5" rx="3.2" ry="2.5" fill="#7fbf8a"/>
    <!-- head drooped -->
    <rect x="9.5" y="11" width="3" height="3.5" rx="1.5" fill="#4e9e5a"/>
    <circle cx="11" cy="9.5" r="5" fill="#4e9e5a"/>
    <polygon points="8.5,5.5 9.5,2.5 11,5.5" fill="#ff7043"/>
    <polygon points="11,5.5 12.5,2.5 13.5,5.5" fill="#ff7043"/>
    <ellipse cx="11" cy="12" rx="2.2" ry="1.3" fill="#3a7a44"/>
    <circle cx="10.2" cy="12" r=".4" fill="#2d5e35"/>
    <circle cx="11.8" cy="12" r=".4" fill="#2d5e35"/>
    <!-- droopy half-closed eyes -->
    <circle cx="9" cy="9" r="2" fill="#f0f0f0"/>
    <circle cx="13" cy="9" r="2" fill="#f0f0f0"/>
    <ellipse cx="9" cy="9.4" rx="1" ry=".6" fill="#111827"/>
    <ellipse cx="13" cy="9.4" rx="1" ry=".6" fill="#111827"/>
    <path d="M7.2 8.2 Q9 9.4 10.8 8.2" stroke="#4e9e5a" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M11.2 8.2 Q13 9.4 14.8 8.2" stroke="#4e9e5a" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M9.5 13.5 Q11 14.5 12.5 13.5" stroke="#2d5e35" stroke-width=".7" stroke-linecap="round" fill="none"/>
  </g>
  <text class="dz-z" x="16" y="4" font-size="4" fill="#97c4a0" font-weight="bold">z</text>
</svg>
