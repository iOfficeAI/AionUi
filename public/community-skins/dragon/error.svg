<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .e-body { transform-origin: 11px 14px; animation: e-shake .15s ease-in-out 4; }
      .e-flash { animation: e-red 1s ease-in-out 2; }
      @keyframes e-shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-2px)} 75%{transform:translateX(2px)} }
      @keyframes e-red   { 0%,100%{opacity:0} 50%{opacity:.25} }
    </style>
  </defs>
  <g class="e-body">
    <polygon points="7,13 0,18 7,20" fill="#3a7a44"/>
    <polygon points="15,13 22,18 15,20" fill="#3a7a44"/>
    <path d="M13 20 Q17 22 15 25 Q12 24 13 21" fill="#3a7a44"/>
    <ellipse cx="11" cy="16" rx="5" ry="4.5" fill="#4e9e5a"/>
    <!-- red flash overlay -->
    <ellipse class="e-flash" cx="11" cy="16" rx="5" ry="4.5" fill="#ef4444"/>
    <ellipse cx="11" cy="16.5" rx="3" ry="2.8" fill="#7fbf8a"/>
    <rect x="9" y="10.5" width="4" height="3" rx="1.5" fill="#4e9e5a"/>
    <circle cx="11" cy="8.5" r="5" fill="#4e9e5a"/>
    <circle class="e-flash" cx="11" cy="8.5" r="5" fill="#ef4444"/>
    <polygon points="8.5,4.5 9.5,1.5 11,4.5" fill="#ff7043"/>
    <polygon points="11,4.5 12.5,1.5 13.5,4.5" fill="#ff7043"/>
    <ellipse cx="11" cy="11" rx="2.2" ry="1.3" fill="#3a7a44"/>
    <circle cx="10.2" cy="11" r=".4" fill="#2d5e35"/>
    <circle cx="11.8" cy="11" r=".4" fill="#2d5e35"/>
    <!-- sad droopy eyes -->
    <circle cx="9" cy="8.5" r="2" fill="#f0f0f0"/>
    <circle cx="13" cy="8.5" r="2" fill="#f0f0f0"/>
    <ellipse cx="9" cy="9" rx="1" ry=".8" fill="#111827"/>
    <ellipse cx="13" cy="9" rx="1" ry=".8" fill="#111827"/>
    <!-- sad brows -->
    <path d="M7.5 6.5 Q9 7.5 10.5 6.8" stroke="#3a7a44" stroke-width=".8" stroke-linecap="round" fill="none"/>
    <path d="M11.5 6.8 Q13 7.5 14.5 6.5" stroke="#3a7a44" stroke-width=".8" stroke-linecap="round" fill="none"/>
    <!-- sad mouth -->
    <path d="M8.5 13.5 Q11 12 13.5 13.5" stroke="#2d5e35" stroke-width=".8" stroke-linecap="round" fill="none"/>
    <!-- small tear -->
    <ellipse cx="7.5" cy="10.5" rx=".5" ry=".8" fill="#60a5fa" opacity=".8"/>
  </g>
</svg>
