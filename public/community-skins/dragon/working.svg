<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .w-body { transform-origin: 11px 14px; animation: w-bob .6s ease-in-out infinite; }
      .w-wing-l { transform-origin: 7px 15px; animation: w-flap .4s ease-in-out infinite; }
      .w-wing-r { transform-origin: 15px 15px; animation: w-flap .4s ease-in-out infinite reverse; }
      @keyframes w-bob  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-2px)} }
      @keyframes w-flap { 0%,100%{transform:rotate(0deg) scaleY(1)} 50%{transform:rotate(-15deg) scaleY(.6)} }
    </style>
  </defs>
  <g class="w-body">
    <polygon class="w-wing-l" points="7,12 -1,16 7,21" fill="#3a7a44"/>
    <polygon class="w-wing-r" points="15,12 23,16 15,21" fill="#3a7a44"/>
    <path d="M13 20 Q17 22 15 25 Q12 24 13 21" fill="#3a7a44"/>
    <ellipse cx="11" cy="16" rx="5" ry="4.5" fill="#4e9e5a"/>
    <ellipse cx="11" cy="16.5" rx="3" ry="2.8" fill="#7fbf8a"/>
    <rect x="9" y="10.5" width="4" height="3" rx="1.5" fill="#4e9e5a"/>
    <circle cx="11" cy="8.5" r="5" fill="#4e9e5a"/>
    <polygon points="8.5,4.5 9.5,1.5 11,4.5" fill="#ff7043"/>
    <polygon points="11,4.5 12.5,1.5 13.5,4.5" fill="#ff7043"/>
    <ellipse cx="11" cy="11" rx="2.2" ry="1.3" fill="#3a7a44"/>
    <circle cx="10.2" cy="11" r=".4" fill="#2d5e35"/>
    <circle cx="11.8" cy="11" r=".4" fill="#2d5e35"/>
    <!-- focused squint eyes -->
    <circle cx="9" cy="8" r="2" fill="#f0f0f0"/>
    <circle cx="13" cy="8" r="2" fill="#f0f0f0"/>
    <ellipse cx="9" cy="8" rx="1.1" ry=".7" fill="#111827"/>
    <ellipse cx="13" cy="8" rx="1.1" ry=".7" fill="#111827"/>
    <!-- determined mouth -->
    <path d="M9 12.5 L13 12.5" stroke="#2d5e35" stroke-width=".8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
