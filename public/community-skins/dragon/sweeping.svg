<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .sw-body { transform-origin: 11px 14px; animation: sw-sway 1s ease-in-out infinite alternate; }
      .sw-broom { transform-origin: 8px 20px; animation: sw-sweep 1s ease-in-out infinite alternate; }
      .sw-dust  { animation: sw-puff 1s ease-in-out infinite; }
      @keyframes sw-sway  { 0%{transform:rotate(-4deg)} 100%{transform:rotate(4deg)} }
      @keyframes sw-sweep { 0%{transform:rotate(-15deg)} 100%{transform:rotate(15deg)} }
      @keyframes sw-puff  { 0%,100%{opacity:.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.2)} }
    </style>
  </defs>
  <g class="sw-body">
    <polygon points="7,13 0,18 7,20" fill="#3a7a44"/>
    <polygon points="15,13 22,18 15,20" fill="#3a7a44"/>
    <path d="M13 20 Q17 22 15 25 Q12 24 13 21" fill="#3a7a44"/>
    <ellipse cx="11" cy="16" rx="5" ry="4.5" fill="#4e9e5a"/>
    <ellipse cx="11" cy="16.5" rx="3" ry="2.8" fill="#7fbf8a"/>
    <!-- broom -->
    <g class="sw-broom">
      <rect x="7" y="16" width="1" height="9" rx=".4" fill="#a0522d"/>
      <path d="M4 25 Q7.5 23 11 25" stroke="#8B7355" stroke-width="2" stroke-linecap="round" fill="none"/>
    </g>
    <!-- dust puffs -->
    <circle class="sw-dust" cx="3" cy="26" r="1.5" fill="#d1d5db" opacity=".6"/>
    <circle class="sw-dust" cx="1" cy="24" r="1" fill="#d1d5db" opacity=".4"/>
    <rect x="9" y="10.5" width="4" height="3" rx="1.5" fill="#4e9e5a"/>
    <circle cx="11" cy="8.5" r="5" fill="#4e9e5a"/>
    <polygon points="8.5,4.5 9.5,1.5 11,4.5" fill="#ff7043"/>
    <polygon points="11,4.5 12.5,1.5 13.5,4.5" fill="#ff7043"/>
    <ellipse cx="11" cy="11" rx="2.2" ry="1.3" fill="#3a7a44"/>
    <circle cx="10.2" cy="11" r=".4" fill="#2d5e35"/>
    <circle cx="11.8" cy="11" r=".4" fill="#2d5e35"/>
    <circle cx="9" cy="8" r="2" fill="#f0f0f0"/>
    <circle cx="13" cy="8" r="2" fill="#f0f0f0"/>
    <ellipse cx="9" cy="8" rx="1.1" ry=".8" fill="#111827"/>
    <ellipse cx="13" cy="8" rx="1.1" ry=".8" fill="#111827"/>
    <path d="M9 12.5 L13 12.5" stroke="#2d5e35" stroke-width=".8" stroke-linecap="round"/>
  </g>
</svg>
