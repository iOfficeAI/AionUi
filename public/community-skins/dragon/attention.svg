<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .a-body { transform-origin: 11px 14px; animation: a-jump .4s ease-out 1 forwards; }
      .a-mark { animation: a-pop .5s ease-out 1 forwards; }
      @keyframes a-jump { 0%{transform:translateY(0)} 40%{transform:translateY(-7px)} 100%{transform:translateY(0)} }
      @keyframes a-pop  { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.3)} 100%{transform:scale(1);opacity:1} }
    </style>
  </defs>
  <!-- ! mark -->
  <g class="a-mark">
    <rect x="10" y="-10" width="2" height="7" rx="1" fill="#ff7043"/>
    <circle cx="11" cy="-1" r="1.2" fill="#ff7043"/>
  </g>
  <g class="a-body">
    <polygon points="7,12 -1,16 7,20" fill="#3a7a44"/>
    <polygon points="15,12 23,16 15,20" fill="#3a7a44"/>
    <path d="M13 20 Q17 22 15 25 Q12 24 13 21" fill="#3a7a44"/>
    <ellipse cx="11" cy="16" rx="5" ry="4.5" fill="#4e9e5a"/>
    <ellipse cx="11" cy="16.5" rx="3" ry="2.8" fill="#7fbf8a"/>
    <rect x="9" y="10.5" width="4" height="3" rx="1.5" fill="#4e9e5a"/>
    <circle cx="11" cy="8.5" r="5" fill="#4e9e5a"/>
    <polygon points="8.5,4.5 9.5,1.5 11,4.5" fill="#ff7043"/>
    <polygon points="11,4.5 12.5,1.5 13.5,4.5" fill="#ff7043"/>
    <ellipse cx="11" cy="11" rx="2.2" ry="1.3" fill="#3a7a44"/>
    <circle cx="10.2" cy="11" r=".4" fill="#2d5e35"/>
    <circle cx="11.8" cy="11" r=".4" fill="#2d5e35"/>
    <!-- wide surprised eyes -->
    <circle cx="9" cy="8" r="2.2" fill="#f0f0f0"/>
    <circle cx="13" cy="8" r="2.2" fill="#f0f0f0"/>
    <circle cx="9" cy="8" r="1.3" fill="#111827"/>
    <circle cx="13" cy="8" r="1.3" fill="#111827"/>
    <circle cx="9.5" cy="7.5" r=".4" fill="white"/>
    <circle cx="13.5" cy="7.5" r=".4" fill="white"/>
    <!-- O mouth -->
    <ellipse cx="11" cy="13" rx="1.2" ry="1" fill="none" stroke="#2d5e35" stroke-width=".8"/>
  </g>
</svg>
