<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .rr-body { transform-origin: 11px 14px; animation: rr-read 6s ease-in-out 1 forwards; }
      @keyframes rr-read { 0%,100%{transform:rotate(0)} 40%{transform:rotate(-3deg)} 70%{transform:rotate(2deg)} }
    </style>
  </defs>
  <g class="rr-body">
    <polygon points="7,13 0,18 7,20" fill="#3a7a44" opacity=".7"/>
    <polygon points="15,13 22,18 15,20" fill="#3a7a44" opacity=".7"/>
    <path d="M13 20 Q17 22 15 25 Q12 24 13 21" fill="#3a7a44"/>
    <ellipse cx="11" cy="16" rx="5" ry="4.5" fill="#4e9e5a"/>
    <ellipse cx="11" cy="16.5" rx="3" ry="2.8" fill="#7fbf8a"/>
    <!-- book held in front -->
    <rect x="5" y="18" width="12" height="8" rx="1" fill="#3b82f6"/>
    <rect x="5" y="18" width="1.5" height="8" rx=".5" fill="#1d4ed8"/>
    <line x1="8" y1="20" x2="15" y2="20" stroke="white" stroke-width=".5" opacity=".5"/>
    <line x1="8" y1="22" x2="15" y2="22" stroke="white" stroke-width=".5" opacity=".5"/>
    <line x1="8" y1="24" x2="13" y2="24" stroke="white" stroke-width=".5" opacity=".5"/>
    <rect x="9" y="10.5" width="4" height="3" rx="1.5" fill="#4e9e5a"/>
    <circle cx="11" cy="8.5" r="5" fill="#4e9e5a"/>
    <polygon points="8.5,4.5 9.5,1.5 11,4.5" fill="#ff7043"/>
    <polygon points="11,4.5 12.5,1.5 13.5,4.5" fill="#ff7043"/>
    <ellipse cx="11" cy="11" rx="2.2" ry="1.3" fill="#3a7a44"/>
    <circle cx="10.2" cy="11" r=".4" fill="#2d5e35"/>
    <circle cx="11.8" cy="11" r=".4" fill="#2d5e35"/>
    <!-- eyes looking down at book -->
    <circle cx="9" cy="8" r="2" fill="#f0f0f0"/>
    <circle cx="13" cy="8" r="2" fill="#f0f0f0"/>
    <circle cx="9" cy="9" r="1.1" fill="#111827"/>
    <circle cx="13" cy="9" r="1.1" fill="#111827"/>
    <path d="M9 12.5 Q11 13.5 13 12.5" stroke="#2d5e35" stroke-width=".7" stroke-linecap="round" fill="none"/>
  </g>
</svg>
