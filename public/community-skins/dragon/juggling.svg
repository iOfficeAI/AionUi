<svg viewBox="-18 -18 58 58" width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .j-body { transform-origin: 11px 14px; animation: j-spin .3s ease-in-out infinite alternate; }
      .j-b1   { animation: j-arc1 .8s ease-in-out infinite; }
      .j-b2   { animation: j-arc2 .8s ease-in-out .27s infinite; }
      .j-b3   { animation: j-arc3 .8s ease-in-out .54s infinite; }
      @keyframes j-spin { 0%{transform:rotate(-3deg)} 100%{transform:rotate(3deg)} }
      @keyframes j-arc1 { 0%,100%{transform:translate(-4px,8px)} 50%{transform:translate(4px,-6px)} }
      @keyframes j-arc2 { 0%,100%{transform:translate(4px,4px)} 50%{transform:translate(-4px,-4px)} }
      @keyframes j-arc3 { 0%,100%{transform:translate(0px,8px)} 50%{transform:translate(0px,-8px)} }
    </style>
  </defs>
  <circle class="j-b1" cx="11" cy="6" r="1.8" fill="#ff7043"/>
  <circle class="j-b2" cx="11" cy="6" r="1.8" fill="#ffd700"/>
  <circle class="j-b3" cx="11" cy="6" r="1.8" fill="#60a5fa"/>
  <g class="j-body">
    <polygon points="7,13 0,18 7,20" fill="#3a7a44"/>
    <polygon points="15,13 22,18 15,20" fill="#3a7a44"/>
    <path d="M13 20 Q17 22 15 25 Q12 24 13 21" fill="#3a7a44"/>
    <ellipse cx="11" cy="16" rx="5" ry="4.5" fill="#4e9e5a"/>
    <ellipse cx="11" cy="16.5" rx="3" ry="2.8" fill="#7fbf8a"/>
    <rect x="9" y="10.5" width="4" height="3" rx="1.5" fill="#4e9e5a"/>
    <circle cx="11" cy="8.5" r="5" fill="#4e9e5a"/>
    <polygon points="8.5,4.5 9.5,1.5 11,4.5" fill="#ff7043"/>
    <polygon points="11,4.5 12.5,1.5 13.5,4.5" fill="#ff7043"/>
    <ellipse cx="11" cy="11" rx="2.2" ry="1.3" fill="#3a7a44"/>
    <circle cx="10.2" cy="11" r=".4" fill="#2d5e35"/>
    <circle cx="11.8" cy="11" r=".4" fill="#2d5e35"/>
    <!-- dizzy swirl eyes -->
    <circle cx="9" cy="8" r="2" fill="#f0f0f0"/>
    <circle cx="13" cy="8" r="2" fill="#f0f0f0"/>
    <text x="7.5" y="9.5" font-size="3.5" fill="#111827">@</text>
    <text x="11.5" y="9.5" font-size="3.5" fill="#111827">@</text>
    <path d="M8.5 12.5 Q11 14.5 13.5 12.5" stroke="#2d5e35" stroke-width=".8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
