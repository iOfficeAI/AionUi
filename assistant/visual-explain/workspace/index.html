<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flow Field Test</title>
<script src="p5.min.js"></script>
<style>
  body { margin: 0; background: #0a0a14; display: flex; align-items: center; justify-content: center; height: 100vh; }
</style>
</head>
<body>
<script>
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(42);
function sr() { return rng(); }
function srr(a, b) { return a + sr() * (b - a); }

const SIZE = 800;
const COLORS = ['#d97757', '#6a9bcc', '#88d4ab', '#e8c07a', '#c084fc'];

function setup() {
  createCanvas(SIZE, SIZE);
  pixelDensity(1);
  noLoop();
  generateArt();
}

function generateArt() {
  background('#0a0a14');

  let ox = sr() * 1000, oy = sr() * 1000;
  let sc = 0.004;

  // flow field
  noFill();
  for (let i = 0; i < 600; i++) {
    let x = srr(0, width);
    let y = srr(0, height);
    let c = color(COLORS[Math.floor(sr() * COLORS.length)]);
    c.setAlpha(srr(20, 70));
    stroke(c);
    strokeWeight(srr(0.5, 2));
    beginShape();
    for (let s = 0; s < 120; s++) {
      curveVertex(x, y);
      let a = noise(x * sc + ox, y * sc + oy) * TWO_PI * 2;
      x += cos(a) * 3;
      y += sin(a) * 3;
    }
    endShape();
  }

  // highlight dots
  noStroke();
  for (let i = 0; i < 40; i++) {
    let c = color(COLORS[Math.floor(sr() * COLORS.length)]);
    c.setAlpha(srr(100, 220));
    fill(c);
    ellipse(srr(50, width - 50), srr(50, height - 50), srr(2, 6));
  }
}
</script>
</body>
</html>
