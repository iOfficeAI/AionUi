[project]
name = "ai-analyst-genome"
license = "Apache-2.0"
version = "1.0.0"
description = "AI Data Analyst for Vietnamese stock market - powered by AI Analyst Genome"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "vnstock>=3.4.2",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "pandas-ta",
    "plotly>=5.18.0",
    "kaleido>=0.2.1",
    "pydantic>=2.4.2",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "requests>=2.32.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helpers"]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
force_alphabetical_sort_within_sections = true
