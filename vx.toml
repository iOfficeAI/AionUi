[tools]
bun = "latest"
git = "latest"
just = "latest"
node = "22"
python = "3.12"

[tools.msvc]
version = "14.42"
components = ["spectre"]
os = ["windows"]

[settings]
auto_install = true
cache_duration = "7d"

[scripts]
# All scripts use bun for speed
build = "bun run build"
build-deb = "bun run build-deb"
build-linux = "just build-linux"
build-mac = "bun run build-mac"
build-mac-arm64 = "just build-mac-arm64"
build-mac-x64 = "just build-mac-x64"
"build-mac:arm64" = "bun run build-mac:arm64"
"build-mac:x64" = "bun run build-mac:x64"
build-win = "bun run build-win"
build-win-arm64 = "just build-win-arm64"
build-win-x64 = "just build-win-x64"
check = "just check"
ci-local = "just ci-local"
clean = "just clean"
clean-all = "just clean-all"
# CLI and dev scripts use bun for speed
cli = "bun run cli"
cli-ext = "just cli-ext"
default = "just default"
dev = "just dev"
dev-ext = "just dev-ext"
dist = "bun run dist"
"dist:linux" = "bun run dist:linux"
"dist:mac" = "bun run dist:mac"
"dist:win" = "bun run dist:win"
ext-test = "just ext-test"
ext-test-watch = "just ext-test-watch"
ext-typecheck = "just ext-typecheck"
fmt = "just fmt"
fmt-check = "just fmt-check"
format = "bun run format"
"format:check" = "bun run format:check"
info = "just info"
install = "just install"
install-update = "just install-update"
lint = "bun run lint"
lint-fix = "just lint-fix"
"lint:fix" = "bun run lint:fix"
list-artifacts = "just list-artifacts"
make = "bun run make"
package = "bun run package"
postinstall = "bun run postinstall"
preflight = "just preflight"
prepare = "bun run prepare"
rebuild-native = "just rebuild-native"
reset-password = "just reset-password"
resetpass = "bun run resetpass"
setup = "just setup"
start = "bun run start"
test = "bun run test"
test-contract = "just test-contract"
test-coverage = "just test-coverage"
test-integration = "just test-integration"
test-watch = "just test-watch"
"test:contract" = "bun run test:contract"
"test:coverage" = "bun run test:coverage"
"test:integration" = "bun run test:integration"
"test:watch" = "bun run test:watch"
typecheck = "bunx tsc --noEmit"
verify-native = "just verify-native"
webui = "bun run webui"
webui-ext = "just webui-ext"
webui-prod = "just webui-prod"
webui-remote = "just webui-remote"
"webui:prod" = "bun run webui:prod"
"webui:prod:remote" = "bun run webui:prod:remote"
"webui:remote" = "bun run webui:remote"
