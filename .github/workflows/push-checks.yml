name: Push Checks

on:
  push:
    branches:
      - '**'

concurrency:
  group: push-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  quality:
    name: Lint, Format, Typecheck, I18n, and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Run lint
        run: bun run lint -- --quiet

      - name: Check formatting
        run: bun run format:check

      - name: Check TypeScript
        run: bunx tsc --noEmit

      - name: Generate i18n types
        run: bun run i18n:types

      - name: Validate i18n
        run: node scripts/check-i18n.js

      - name: Run unit tests
        run: bun run test
