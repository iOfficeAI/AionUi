name: Distribute Release Assets

# Triggered after a GitHub Release is officially published.
# Mirrors desktop installers, updater metadata, blockmaps, and web-cli assets
# to the configured distribution endpoint for external download / auto-update.
#
# Why `published` (not `released`)?
#   - `released` is supposed to fire when a non-prerelease release is published,
#     but GitHub sometimes only emits `published` (not `released`) when a pre-existing
#     draft is publicly released, causing the workflow to be silently skipped.
#   - `published` reliably fires on every draft → public transition, including
#     prereleases. The `if` guard on the job filters out prereleases explicitly.
#
# All credentials / identifiers are read from repository secrets / variables:
#   Secrets:
#   - TENCENT_COS_SECRET_ID
#   - TENCENT_COS_SECRET_KEY
#   Secrets:
#   - TENCENT_COS_BUCKET
#   - TENCENT_COS_REGION
#   - POUNDING_UPDATE_PUBLIC_BASE (optional, e.g. https://download.api.mxou.cn)
#   Variables:
# Do NOT hardcode secrets in this file.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to redistribute (e.g. v1.9.21)'
        required: true
        type: string
      cleanup_existing:
        description: 'Delete existing version/latest objects before manual redistribution'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  group: release-distribute-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  distribute:
    name: Distribute release assets
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    steps:
      - name: Extract version from tag
        id: version
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag provided (event did not supply one)."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG / Version: $VERSION"

      - name: Validate COS configuration
        env:
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        run: |
          test -n "$TENCENT_COS_BUCKET" || { echo "::error::Missing repository secret TENCENT_COS_BUCKET"; exit 1; }
          test -n "$TENCENT_COS_REGION" || { echo "::error::Missing repository secret TENCENT_COS_REGION"; exit 1; }
          test -n "$TENCENT_COS_SECRET_ID" || { echo "::error::Missing repository secret TENCENT_COS_SECRET_ID"; exit 1; }
          test -n "$TENCENT_COS_SECRET_KEY" || { echo "::error::Missing repository secret TENCENT_COS_SECRET_KEY"; exit 1; }

      - name: Install COSCLI
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            -o coscli \
            https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64
          echo '7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91  coscli' | sha256sum -c -
          chmod 755 coscli
          ./coscli --version

      - name: Guard against same-version overwrite
        env:
          COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          CLEANUP_EXISTING: ${{ github.event.inputs.cleanup_existing || 'true' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          coscli_cmd() {
            ./coscli "$@" \
              -e "cos.${COS_REGION}.myqcloud.com" \
              -i "$COS_SECRET_ID" \
              -k "$COS_SECRET_KEY" \
              --init-skip=true \
              --disable-log=true
          }

          VERSION_PATH="cos://${COS_BUCKET}/releases/download/${VERSION}/"
          EXISTING_COUNT=$(coscli_cmd ls "$VERSION_PATH" -r --limit -1 2>/dev/null | grep -c . || true)

          if [ "$EXISTING_COUNT" -gt 0 ]; then
            if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] && [ "$CLEANUP_EXISTING" = 'true' ]; then
              echo "Manual redistribution requested; removing $EXISTING_COUNT existing version object(s) before retry."
              coscli_cmd rm "$VERSION_PATH" -r -f
            else
              echo "::error::Version directory already contains $EXISTING_COUNT file(s). Refusing to overwrite."
              echo "::error::Same-version re-publish is not allowed (downstream caches would serve stale files). Release a new version instead."
              coscli_cmd ls "$VERSION_PATH" -r --limit -1 || true
              exit 1
            fi
          fi

      - name: Download release assets from GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[] | select(.tag_name == "${{ steps.version.outputs.tag }}") | .assets[] | [.name, .url] | @tsv' \
            | while IFS=$'\t' read -r name url; do
                case "$name" in
                  *.dmg|*.exe|*.msi|*.deb|*.zip|*.yml|*.blockmap|*.tar.gz|*.sha256|install-web.sh)
                    echo "Downloading $name"
                    gh api --header "Accept: application/octet-stream" "$url" > "dist/$name"
                    ;;
                  *)
                    echo "Skipping $name"
                    ;;
                esac
              done
          test -n "$(find dist -maxdepth 1 -type f -print -quit)" || {
            echo "::error::No release assets were downloaded for tag ${{ steps.version.outputs.tag }}"
            exit 1
          }
          echo "Downloaded files:"
          ls -la dist

      - name: Upload assets to versioned and latest prefixes
        env:
          COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          CLEANUP_EXISTING: ${{ github.event.inputs.cleanup_existing || 'true' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          coscli_cmd() {
            ./coscli "$@" \
              -e "cos.${COS_REGION}.myqcloud.com" \
              -i "$COS_SECRET_ID" \
              -k "$COS_SECRET_KEY" \
              --init-skip=true \
              --disable-log=true
          }

          VERSION_PATH="cos://${COS_BUCKET}/releases/download/${VERSION}/"
          LATEST_PATH="cos://${COS_BUCKET}/releases/latest/"

          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] && [ "$CLEANUP_EXISTING" = 'true' ]; then
            coscli_cmd rm "$LATEST_PATH" -r -f || true
          fi

          coscli_cmd cp dist/ "$VERSION_PATH" -r
          coscli_cmd cp dist/ "$LATEST_PATH" -r

          find dist -maxdepth 1 -type f \( -name '*.yml' -o -name '*.blockmap' \) | sort | while read -r file; do
            name="$(basename "$file")"
            coscli_cmd cp \
              "$file" \
              "${LATEST_PATH}${name}" \
              --meta 'Cache-Control:no-cache, no-store, must-revalidate, max-age=0'
          done

          echo "Uploaded release ${VERSION} to COS"

      - name: Verify public distribution endpoints
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          PUBLIC_BASE: ${{ secrets.POUNDING_UPDATE_PUBLIC_BASE }}
        run: |
          set -euo pipefail

          BASE="${PUBLIC_BASE:-https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com}"
          URLS=(
            "${BASE}/releases/latest/latest.yml"
            "${BASE}/releases/latest/latest-mac.yml"
            "${BASE}/releases/download/${VERSION}/POUNDING-${VERSION}-win-x64.exe"
          )

          for url in "${URLS[@]}"; do
            echo "Verifying ${url}"
            curl -fI --retry 5 --retry-delay 2 --retry-connrefused "$url"
          done

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          PUBLIC_BASE: ${{ secrets.POUNDING_UPDATE_PUBLIC_BASE }}
        run: |
          BASE="${PUBLIC_BASE:-https://${COS_BUCKET}.cos.${COS_REGION}.myqcloud.com}"
          {
            echo "### Release assets distributed"
            echo ""
            echo "- Tag: \`${TAG}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- Versioned assets: \`${BASE}/releases/download/${VERSION}/\`"
            echo "- Auto-update feed: \`${BASE}/releases/latest/\`"
          } >> "$GITHUB_STEP_SUMMARY"
