name: '✅ PR Checks'

on:
  pull_request:
    types: [opened, synchronize, edited]
    branches: [main, dev]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  # Job 1: Code quality checks (TypeScript, ESLint, Prettier)
  code-quality:
    name: Code Quality
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup vx
        uses: loonghao/vx@v0.8.4
        with:
          tools: 'node@22 bun'
          setup: 'true'
          cache: 'true'

      - name: Install dependencies
        run: |
          rm -rf node_modules
          vx bun install --ignore-scripts
        env:
          BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

      - name: Run postinstall
        run: vx bun run postinstall || true

      - name: TypeScript Check
        run: vx bunx tsc --noEmit

      - name: ESLint Check
        run: vx bun run lint

      - name: Prettier Check
        run: vx bun run format:check

  # Job 2: Unit tests across all platforms
  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    if: github.event.action != 'edited'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2022]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup vx
        uses: loonghao/vx@v0.8.4
        with:
          tools: 'node@22 bun'
          setup: 'true'
          cache: 'true'

      - name: Install dependencies
        run: |
          rm -rf node_modules
          vx bun install --ignore-scripts
        env:
          BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

      - name: Run postinstall
        run: vx bun run postinstall || true

      - name: Run extension system tests
        run: vx bunx vitest run tests

  # Job 3: Trigger GPT AI review (only on first PR submission)
  review:
    name: AI Review
    needs: [code-quality, unit-tests]
    if: github.event.action == 'opened'
    uses: './.github/workflows/gpt-review.yml'
    with:
      pr_number: '${{ github.event.pull_request.number }}'
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit

  # Job 4: Check if PR author is an external contributor
  check-external:
    name: Check External
    needs: [code-quality, unit-tests]
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    outputs:
      is_external: ${{ steps.check.outputs.is_external }}
    steps:
      - name: Check author permission level
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const username = context.payload.pull_request.user.login;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username,
              });
              const permission = data.permission;
              const isExternal = permission !== 'admin' && permission !== 'maintain' && permission !== 'write';
              core.info(`User ${username}: permission=${permission}, is external: ${isExternal}`);
              core.setOutput('is_external', String(isExternal));
            } catch (error) {
              core.info(`User ${username}: permission check failed (${error.message}), treating as external`);
              core.setOutput('is_external', 'true');
            }

  # Job 5: Trigger GPT PR assessment for external contributors
  assessment:
    name: PR Assessment
    needs: [check-external]
    if: needs.check-external.outputs.is_external == 'true'
    uses: './.github/workflows/gpt-pr-assessment.yml'
    with:
      pr_number: '${{ github.event.pull_request.number }}'
    permissions:
      contents: read
      pull-requests: write
      issues: read
    secrets: inherit
