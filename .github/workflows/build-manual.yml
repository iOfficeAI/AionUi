name: '🔨 Manual Build'
run-name: 'Manual Build · ${{ inputs.platform }} · ${{ inputs.branch }}'

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: string
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64
          - linux-x64
          - linux-arm64
          - all
        default: 'macos-arm64'
      skip_code_quality:
        description: 'Skip code quality checks (faster builds for debugging)'
        required: false
        type: boolean
        default: false
      internal_test_build:
        description: 'Internal test only: allow non-Developer-ID macOS signing; publish only as a prerelease'
        required: false
        type: boolean
        default: false
      gea_packaged_acceptance:
        description: 'Internal test only: enable packaged GEA client presence and mandatory updates'
        required: false
        type: boolean
        default: false
      gea_version_code:
        description: 'Required positive integer versionCode when packaged GEA acceptance is enabled'
        required: false
        type: string
        default: ''
      aioncore_run_id:
        description: 'Optional AionCore Manual Build workflow run id to bundle instead of the pinned release'
        required: false
        type: string
        default: ''
      aioncore_repository:
        description: 'Repository that owns the optional AionCore workflow run'
        required: false
        type: string
        default: 'CleverC2200/AionCore'
      aioncore_expected_head_sha:
        description: 'Optional expected commit SHA for the AionCore workflow run'
        required: false
        type: string
        default: ''
      aioncore_sha256s:
        description: 'Optional JSON map of artifact names to expected archive SHA256 values'
        required: false
        type: string
        default: '{}'

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          PLATFORM="${{ inputs.platform }}"

          MACOS_ARM64='{"platform":"macos-arm64","os":"macos-14","command":"node scripts/build-with-builder.js arm64 --mac dmg --arm64","artifact-name":"macos-build-arm64","arch":"arm64"}'
          MACOS_X64='{"platform":"macos-x64","os":"macos-14","command":"node scripts/build-with-builder.js x64 --mac dmg --x64","artifact-name":"macos-build-x64","arch":"x64"}'
          WINDOWS_X64='{"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"}'
          WINDOWS_ARM64='{"platform":"windows-arm64","os":"windows-11-arm","command":"node scripts/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"}'
          LINUX_X64='{"platform":"linux-x64","os":"ubuntu-latest","command":"node scripts/build-with-builder.js x64 --linux --x64","artifact-name":"linux-build-x64","arch":"x64"}'
          LINUX_ARM64='{"platform":"linux-arm64","os":"ubuntu-24.04-arm","command":"node scripts/build-with-builder.js arm64 --linux --arm64","artifact-name":"linux-build-arm64","arch":"arm64"}'

          if [ "$PLATFORM" = "all" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64,$MACOS_X64,$WINDOWS_X64,$WINDOWS_ARM64,$LINUX_X64,$LINUX_ARM64]}"
          elif [ "$PLATFORM" = "macos-arm64" ]; then
            MATRIX="{\"include\":[$MACOS_ARM64]}"
          elif [ "$PLATFORM" = "macos-x64" ]; then
            MATRIX="{\"include\":[$MACOS_X64]}"
          elif [ "$PLATFORM" = "windows-x64" ]; then
            MATRIX="{\"include\":[$WINDOWS_X64]}"
          elif [ "$PLATFORM" = "windows-arm64" ]; then
            MATRIX="{\"include\":[$WINDOWS_ARM64]}"
          elif [ "$PLATFORM" = "linux-x64" ]; then
            MATRIX="{\"include\":[$LINUX_X64]}"
          elif [ "$PLATFORM" = "linux-arm64" ]; then
            MATRIX="{\"include\":[$LINUX_ARM64]}"
          fi

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Generated matrix for platform '$PLATFORM':"
          echo "$MATRIX" | python3 -m json.tool

  build-pipeline:
    needs: prepare-matrix
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: ${{ needs.prepare-matrix.outputs.matrix }}
      ref: ${{ inputs.branch }}
      skip_code_quality: ${{ inputs.skip_code_quality }}
      internal_test_build: ${{ inputs.internal_test_build }}
      gea_packaged_acceptance: ${{ inputs.gea_packaged_acceptance }}
      gea_version_code: ${{ inputs.gea_version_code }}
      aioncore_run_id: ${{ inputs.aioncore_run_id }}
      aioncore_repository: ${{ inputs.aioncore_repository }}
      aioncore_expected_head_sha: ${{ inputs.aioncore_expected_head_sha }}
      aioncore_sha256s: ${{ inputs.aioncore_sha256s }}
      aioncore_source_policy: ${{ inputs.aioncore_run_id != '' && 'verified-actions' || 'default' }}
      append_commit_hash: true
      upload_installers_only: true
    secrets: inherit
