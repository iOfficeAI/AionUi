name: Fork Manual Build Release

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git ref to build. Leave empty to use repository variable FORK_BUILD_DEFAULT_REF.'
        required: false
        default: ''
        type: string
      platform:
        description: 'Platform to build'
        required: true
        type: choice
        options:
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64
          - linux
          - all
        default: 'all'
      skip_code_quality:
        description: 'Skip code quality checks for faster debugging or fork-safe builds'
        required: false
        type: boolean
        default: false
      skip_release_publish:
        description: 'Build artifacts only and skip GitHub Release publishing'
        required: false
        type: boolean
        default: false

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  resolve-context:
    name: Resolve Build Context
    runs-on: ubuntu-latest
    outputs:
      effective_ref: ${{ steps.resolve.outputs.effective_ref }}
      release_prefix: ${{ steps.resolve.outputs.release_prefix }}
      ref_slug: ${{ steps.resolve.outputs.ref_slug }}

    steps:
      - name: Resolve ref and prefix
        id: resolve
        shell: bash
        run: |
          INPUT_REF="${{ inputs.branch }}"
          DEFAULT_REF="${{ vars.FORK_BUILD_DEFAULT_REF }}"
          RELEASE_PREFIX="${{ vars.FORK_RELEASE_PREFIX }}"

          if [ -n "$INPUT_REF" ]; then
            EFFECTIVE_REF="$INPUT_REF"
          elif [ -n "$DEFAULT_REF" ]; then
            EFFECTIVE_REF="$DEFAULT_REF"
          else
            EFFECTIVE_REF="${GITHUB_REF_NAME}"
          fi

          if [ -z "$RELEASE_PREFIX" ]; then
            RELEASE_PREFIX="fork-dev"
          elif [[ "$RELEASE_PREFIX" != *"-dev"* ]]; then
            RELEASE_PREFIX="${RELEASE_PREFIX}-dev"
          fi

          REF_SLUG=$(echo "$EFFECTIVE_REF" | tr '/:@ ' '-' | tr -cd '[:alnum:]._-')
          if [ -z "$REF_SLUG" ]; then
            REF_SLUG="manual"
          fi

          echo "effective_ref=$EFFECTIVE_REF" >> "$GITHUB_OUTPUT"
          echo "release_prefix=$RELEASE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "ref_slug=$REF_SLUG" >> "$GITHUB_OUTPUT"

          echo "Effective ref: $EFFECTIVE_REF"
          echo "Release prefix: $RELEASE_PREFIX"
          echo "Ref slug: $REF_SLUG"

  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix_posix: ${{ steps.set-matrix.outputs.matrix_posix }}
      matrix_windows: ${{ steps.set-matrix.outputs.matrix_windows }}
      has_posix: ${{ steps.set-matrix.outputs.has_posix }}
      has_windows: ${{ steps.set-matrix.outputs.has_windows }}

    steps:
      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          PLATFORM="${{ inputs.platform }}"

          MACOS_ARM64='{"platform":"macos-arm64","os":"macos-14","command":"node .github/fork-build/build-with-builder.js arm64 --mac --arm64","artifact-name":"macos-build-arm64","arch":"arm64"}'
          MACOS_X64='{"platform":"macos-x64","os":"macos-14","command":"node .github/fork-build/build-with-builder.js x64 --mac --x64","artifact-name":"macos-build-x64","arch":"x64"}'
          WINDOWS_X64='{"platform":"windows-x64","os":"windows-2022","command":"node .github/fork-build/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"}'
          WINDOWS_ARM64='{"platform":"windows-arm64","os":"windows-2022","command":"node .github/fork-build/build-with-builder.js arm64 --win --arm64","artifact-name":"windows-build-arm64","arch":"arm64"}'
          LINUX='{"platform":"linux","os":"ubuntu-latest","command":"node .github/fork-build/build-with-builder.js auto --linux","artifact-name":"linux-build","arch":"x64"}'

          if [ "$PLATFORM" = "all" ]; then
            MATRIX_POSIX="{\"include\":[$MACOS_ARM64,$MACOS_X64,$LINUX]}"
            MATRIX_WINDOWS="{\"include\":[$WINDOWS_X64,$WINDOWS_ARM64]}"
            HAS_POSIX="true"
            HAS_WINDOWS="true"
          elif [ "$PLATFORM" = "macos-arm64" ]; then
            MATRIX_POSIX="{\"include\":[$MACOS_ARM64]}"
            MATRIX_WINDOWS='{"include":[]}'
            HAS_POSIX="true"
            HAS_WINDOWS="false"
          elif [ "$PLATFORM" = "macos-x64" ]; then
            MATRIX_POSIX="{\"include\":[$MACOS_X64]}"
            MATRIX_WINDOWS='{"include":[]}'
            HAS_POSIX="true"
            HAS_WINDOWS="false"
          elif [ "$PLATFORM" = "windows-x64" ]; then
            MATRIX_POSIX='{"include":[]}'
            MATRIX_WINDOWS="{\"include\":[$WINDOWS_X64]}"
            HAS_POSIX="false"
            HAS_WINDOWS="true"
          elif [ "$PLATFORM" = "windows-arm64" ]; then
            MATRIX_POSIX='{"include":[]}'
            MATRIX_WINDOWS="{\"include\":[$WINDOWS_ARM64]}"
            HAS_POSIX="false"
            HAS_WINDOWS="true"
          elif [ "$PLATFORM" = "linux" ]; then
            MATRIX_POSIX="{\"include\":[$LINUX]}"
            MATRIX_WINDOWS='{"include":[]}'
            HAS_POSIX="true"
            HAS_WINDOWS="false"
          else
            echo "Unsupported platform: $PLATFORM"
            exit 1
          fi

          echo "matrix_posix=$MATRIX_POSIX" >> "$GITHUB_OUTPUT"
          echo "matrix_windows=$MATRIX_WINDOWS" >> "$GITHUB_OUTPUT"
          echo "has_posix=$HAS_POSIX" >> "$GITHUB_OUTPUT"
          echo "has_windows=$HAS_WINDOWS" >> "$GITHUB_OUTPUT"

          echo "POSIX matrix:"
          echo "$MATRIX_POSIX" | python3 -m json.tool
          echo "Windows matrix:"
          echo "$MATRIX_WINDOWS" | python3 -m json.tool

  code-quality:
    name: Build Pipeline / Code Quality
    runs-on: ubuntu-latest
    needs: [resolve-context]
    if: ${{ !inputs.skip_code_quality }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-context.outputs.effective_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Run ESLint
        run: bun run lint

      - name: Check Prettier formatting
        run: bun run format:check

      - name: TypeScript type check
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bunx vitest run

  build-posix:
    name: Build Pipeline / Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: [resolve-context, prepare-matrix, code-quality]
    if: >-
      ${{
        always() &&
        needs.prepare-matrix.outputs.has_posix == 'true' &&
        (inputs.skip_code_quality || needs.code-quality.result == 'success')
      }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix_posix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-context.outputs.effective_ref }}

      - name: Get commit hash
        id: commit
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "Commit: $SHORT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Electron artifacts
        id: electron-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-
            electron-cache-${{ matrix.platform }}-

      - name: Cache status
        run: echo "electron-cache-hit=${{ steps.electron-cache.outputs.cache-hit }}"

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Rebuild native modules for Electron
        run: bunx electron-builder install-app-deps
        env:
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder

      - name: Print build configuration
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="
          echo "Platform: ${{ matrix.platform }}"
          echo "Target Architecture: ${{ matrix.arch }}"
          echo "Build Command: ${{ matrix.command }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "Ref: ${{ needs.resolve-context.outputs.effective_ref }}"
          echo "Commit: ${{ steps.commit.outputs.short }}"
          echo "=========================================="

      - name: Setup macOS code signing (macOS only)
        if: startsWith(matrix.platform, 'macos')
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temp-keychain-password' }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Installing code signing certificate..."
            echo $BUILD_CERTIFICATE_BASE64 | base64 --decode > certificate.p12
            security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
            rm certificate.p12
            echo "Certificate imported successfully"
          else
            echo "No certificate provided - building unsigned application"
            echo "To enable code signing, add BUILD_CERTIFICATE_BASE64 and P12_PASSWORD secrets"
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-pip pkg-config libsqlite3-dev fakeroot dpkg-dev rpm libnss3-dev libatk-bridge2.0-dev libdrm2 libxkbcommon-dev libxss1 libatspi2.0-dev libgtk-3-dev libxrandr2 libasound2-dev

      - name: Clean up stale disk images (macOS only)
        if: startsWith(matrix.platform, 'macos')
        run: |
          echo "Cleaning up any stale disk images..."
          hdiutil info 2>/dev/null | grep '/dev/disk' | awk '{print $1}' | while read disk; do
            echo "Detaching $disk..."
            hdiutil detach "$disk" -force 2>/dev/null || true
          done
          rm -f /tmp/*.dmg 2>/dev/null || true
          echo "Cleanup complete"

      - name: Build with electron-builder (macOS)
        if: startsWith(matrix.platform, 'macos')
        id: macos-build
        shell: bash
        run: |
          set +e
          ${{ matrix.command }} 2>&1 | tee "${RUNNER_TEMP}/build.log"
          BUILD_EXIT_CODE=${PIPESTATUS[0]}

          DMG_EXISTS=false
          if ls out/*.dmg 1>/dev/null 2>&1; then
            DMG_EXISTS=true
            echo "DMG created successfully"
          fi

          if [ $BUILD_EXIT_CODE -eq 0 ]; then
            echo "Build completed successfully"
            echo "notarization_status=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$DMG_EXISTS" = true ]; then
            if grep -qiE "notariz|staple" "${RUNNER_TEMP}/build.log"; then
              echo "DMG created but notarization failed"
              echo "notarization_status=failed" >> "$GITHUB_OUTPUT"
              echo "::warning title=Notarization Failed::DMG was built and signed successfully, but notarization failed."
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "## Notarization Warning" >> "$GITHUB_STEP_SUMMARY"
              echo "DMG was built and signed successfully, but notarization failed." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Users may see Gatekeeper warnings when opening the app for the first time." >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "To fix: Right-click the app -> Open -> Open" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          echo "Build failed - DMG was not created"
          echo "notarization_status=build_failed" >> "$GITHUB_OUTPUT"
          exit 1
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.arch }}
          APP_ID: ${{ secrets.APP_ID }}
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APPLE_ID_PASSWORD }}
          teamId: ${{ secrets.TEAM_ID }}
          identity: ${{ secrets.IDENTITY }}
          CSC_NAME: ${{ secrets.IDENTITY }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_MIRROR: ''
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target_arch: ${{ matrix.arch }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Build with electron-builder (Linux)
        if: matrix.platform == 'linux'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 2
          retry_wait_seconds: 60
          command: ${{ matrix.command }}
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.arch }}
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          npm_config_electron_builder_binaries_mirror: https://github.com/electron-userland/electron-builder-binaries/releases/download/
          ELECTRON_MIRROR: ''
          npm_config_disturl: https://electronjs.org/headers
          npm_config_runtime: electron
          npm_config_target_arch: ${{ matrix.arch }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Verify packaged bundled bun assets
        run: bun run test:packaged:bun

      - name: Clean up keychain (macOS only)
        if: startsWith(matrix.platform, 'macos') && always()
        run: |
          if security list-keychains | grep -q build.keychain; then
            security delete-keychain build.keychain
            echo "Temporary keychain deleted"
          fi

      - name: Notify on macOS build failure
        if: startsWith(matrix.platform, 'macos') && failure()
        run: |
          echo "::error title=macOS Build Failed::Build failed. Check the logs for details."
          echo ""
          echo "macOS build failed"
          echo "Common causes:"
          echo "  - hdiutil/DMG creation failure"
          echo "  - Code signing issues"
          echo "  - Notarization timeout"
          echo "  - Out of memory (OOM)"
          echo ""
          echo "Check the build logs above for the specific error."

      - name: List build artifacts
        if: success() || failure()
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD ARTIFACTS"
          echo "=========================================="
          if [ -d "out" ]; then
            ls -lh out/ || true
            echo "=========================================="
            echo "Total artifacts:"
            find out/ -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.zip" -o -name "*.yml" \) -exec basename {} \; || true
          else
            echo "No out directory found!"
          fi

      - name: Clean up non-installer artifacts
        if: success()
        shell: bash
        run: |
          echo "Removing non-installer files from out/ ..."
          rm -f out/*.blockmap out/*.zip out/*.yml out/builder-debug.yml 2>/dev/null || true
          echo "Remaining artifacts:"
          ls -lh out/ || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        if: success()
        with:
          name: ${{ format('{0}-{1}', matrix.artifact-name, steps.commit.outputs.short) }}
          path: |
            out/*.exe
            out/*.msi
            out/*.dmg
            out/*.deb
            out/AionUi-*-win32-*.zip
            out/AionUi-*-mac-*.zip
            out/*.yml
          if-no-files-found: warn
          retention-days: 7

  build-windows:
    name: Build Pipeline / Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    needs: [resolve-context, prepare-matrix, code-quality]
    if: >-
      ${{
        always() &&
        needs.prepare-matrix.outputs.has_windows == 'true' &&
        (inputs.skip_code_quality || needs.code-quality.result == 'success')
      }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix_windows) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-context.outputs.effective_ref }}

      - name: Get commit hash
        id: commit
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "Commit: $SHORT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Electron artifacts
        id: electron-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-cache-${{ matrix.platform }}-${{ matrix.arch }}-
            electron-cache-${{ matrix.platform }}-

      - name: Cache status
        run: echo "electron-cache-hit=${{ steps.electron-cache.outputs.cache-hit }}"

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Setup Windows native dependencies
        run: bun install --global node-gyp

      - name: Install MSVC ARM64 toolchain (Windows ARM64 only)
        if: matrix.platform == 'windows-arm64'
        continue-on-error: true
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 60
          shell: pwsh
          command: |
            choco install visualstudio2022buildtools --yes --params "'--add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --add Microsoft.VisualStudio.Component.Windows11SDK.22000 --includeRecommended --includeOptional'"

      - name: Setup Windows build environment
        shell: pwsh
        run: |
          echo "Setting Windows SDK version for ConPty support"
          echo "WindowsTargetPlatformVersion=10.0.19041.0" >> $env:GITHUB_ENV

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '17.0'

      - name: Print build configuration
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD CONFIGURATION"
          echo "=========================================="
          echo "Platform: ${{ matrix.platform }}"
          echo "Target Architecture: ${{ matrix.arch }}"
          echo "Build Command: ${{ matrix.command }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner Arch: ${{ runner.arch }}"
          echo "Ref: ${{ needs.resolve-context.outputs.effective_ref }}"
          echo "Commit: ${{ steps.commit.outputs.short }}"
          echo "=========================================="

      - name: Rebuild native modules for Electron (Windows)
        id: windows-rebuild
        shell: pwsh
        continue-on-error: false
        run: |
          $arch = "${{ matrix.arch }}"
          $electronVer = (node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')").Trim()

          Write-Host "=========================================="
          Write-Host "Rebuilding native modules for Electron $electronVer ($arch)"
          Write-Host "=========================================="

          $success = $false
          Write-Host ""
          Write-Host "[Step 1] Trying prebuild-install..."
          $prebuildResult = $null
          try {
            $prebuildResult = bun x --yes prebuild-install --runtime=electron --target=$electronVer --platform=win32 --arch=$arch --force 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "prebuild-install succeeded"
              $success = $true
            } else {
              Write-Host "prebuild-install exited with code $LASTEXITCODE"
            }
          } catch {
            Write-Host "prebuild-install failed: $_"
          }

          $sqliteNode = "node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if (-not (Test-Path $sqliteNode)) {
            Write-Host ""
            Write-Host "[Step 2] prebuild-install didn't produce binary, trying electron-rebuild..."
            try {
              bunx electron-rebuild -f -w better-sqlite3
              if ($LASTEXITCODE -eq 0) {
                Write-Host "electron-rebuild succeeded"
                $success = $true
              }
            } catch {
              Write-Host "electron-rebuild failed: $_"
            }
          }

          Write-Host ""
          Write-Host "Verifying native modules..."
          if (Test-Path $sqliteNode) {
            $size = [math]::Round((Get-Item $sqliteNode).Length / 1MB, 1)
            Write-Host "better-sqlite3 found: $sqliteNode ($size MB)"
          } else {
            Write-Error "better-sqlite3 native module not found at: $sqliteNode"
            exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "All critical native modules verified"
          Write-Host "=========================================="
          exit 0
        env:
          npm_config_runtime: electron
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          npm_config_disturl: https://electronjs.org/headers
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022

      - name: Build with electron-builder (Windows)
        if: steps.windows-rebuild.conclusion == 'success'
        id: windows-build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Command = $env:WINDOWS_BUILD_COMMAND
          $BuildFailed = $false

          try {
            Write-Host "Running Windows build command: $Command"
            iex $Command
            Write-Host "Windows build completed successfully"
          } catch {
            $BuildFailed = $true
            Write-Warning "${{ matrix.platform }} build failed but will not block the workflow"
            Write-Host "::notice title=Windows build skipped::${{ matrix.platform }} build failed (see logs above) but workflow is allowed to continue."
          }

          if ($BuildFailed) {
            "result=failure" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "result=success" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
        env:
          WINDOWS_BUILD_COMMAND: ${{ matrix.command }}
          NODE_OPTIONS: '--max-old-space-size=8192'
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_build_from_source: true
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          APP_ID: ${{ secrets.APP_ID }}
          appleId: ${{ secrets.APPLE_ID }}
          appleIdPassword: ${{ secrets.APPLE_ID_PASSWORD }}
          teamId: ${{ secrets.TEAM_ID }}
          identity: ${{ secrets.IDENTITY }}
          CSC_NAME: ${{ secrets.IDENTITY }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022
          WindowsTargetPlatformVersion: 10.0.19041.0
          _WIN32_WINNT: 0x0A00
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Verify packaged bundled bun assets
        if: steps.windows-build.outputs.result == 'success'
        run: bun run test:packaged:bun

      - name: List build artifacts
        if: success() || failure()
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD ARTIFACTS"
          echo "=========================================="
          if [ -d "out" ]; then
            ls -lh out/ || true
            echo "=========================================="
            echo "Total artifacts:"
            find out/ -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.zip" -o -name "*.yml" \) -exec basename {} \; || true
          else
            echo "No out directory found!"
          fi

      - name: Clean up non-installer artifacts
        if: steps.windows-build.outputs.result == 'success'
        shell: bash
        run: |
          echo "Removing non-installer files from out/ ..."
          rm -f out/*.blockmap out/*.zip out/*.yml out/builder-debug.yml 2>/dev/null || true
          echo "Remaining artifacts:"
          ls -lh out/ || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        if: steps.windows-build.outputs.result == 'success'
        with:
          name: ${{ format('{0}-{1}', matrix.artifact-name, steps.commit.outputs.short) }}
          path: |
            out/*.exe
            out/*.msi
            out/*.dmg
            out/*.deb
            out/AionUi-*-win32-*.zip
            out/AionUi-*-mac-*.zip
            out/*.yml
          if-no-files-found: warn
          retention-days: 7

  create-release:
    name: Create Fork Release
    runs-on: ubuntu-latest
    needs: [resolve-context, build-posix, build-windows]
    if: >-
      ${{
        !inputs.skip_release_publish &&
        always() &&
        needs.resolve-context.result == 'success' &&
        needs.build-posix.result != 'cancelled' &&
        needs.build-windows.result != 'cancelled'
      }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-context.outputs.effective_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FULL_SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          UTC_STAMP=$(date -u +'%Y%m%d-%H%M%S')
          PREFIX="${{ needs.resolve-context.outputs.release_prefix }}"
          REF_SLUG="${{ needs.resolve-context.outputs.ref_slug }}"

          # Keep "-dev-" in the default prefix so legacy tag-triggered workflows stay skipped.
          TAG_NAME="${PREFIX}-v${VERSION}-${REF_SLUG}-${UTC_STAMP}-${SHORT_SHA}"
          RELEASE_NAME="${PREFIX} ${VERSION} ${REF_SLUG} ${SHORT_SHA}"

          {
            echo "commit_sha=$FULL_SHA"
            echo "tag_name=$TAG_NAME"
            echo "release_name=$RELEASE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: build-artifacts

      - name: Show release files
        shell: bash
        run: |
          echo "Artifacts prepared for release:"
          find build-artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" \) | sort

      - name: Validate release files
        shell: bash
        run: |
          FILE_COUNT=$(find build-artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" \) | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "No installer files were produced, aborting release creation."
            exit 1
          fi

      - name: Publish fork release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ needs.resolve-context.outputs.effective_ref }}
          name: ${{ steps.meta.outputs.release_name }}
          body: |
            Manual fork build release.

            - Ref: `${{ needs.resolve-context.outputs.effective_ref }}`
            - Platform: `${{ inputs.platform }}`
            - Triggered by: `${{ github.actor }}`
            - Commit: `${{ steps.meta.outputs.commit_sha }}`
          files: |
            build-artifacts/**/*.exe
            build-artifacts/**/*.msi
            build-artifacts/**/*.dmg
            build-artifacts/**/*.deb
          prerelease: true
          draft: false
          generate_release_notes: true
