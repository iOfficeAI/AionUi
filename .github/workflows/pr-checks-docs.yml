name: 'PR Checks (docs only)'

on:
  pull_request:
    types: [opened, synchronize, edited, ready_for_review]
    branches: [main, dev]
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'
      - '.github/ISSUE_TEMPLATE/**'

permissions:
  contents: read

jobs:
  code-quality:
    name: Code Quality
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: npm run postinstall || true

      - name: Install prek
        run: npm install -g @j178/prek

      - name: Run prek checks
        run: prek run --from-ref origin/${{ github.base_ref }} --to-ref HEAD

  unit-tests-ubuntu:
    name: Unit Tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs-only PR, skipping unit tests."

  unit-tests-macos:
    name: Unit Tests (macos-14)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs-only PR, skipping unit tests."

  unit-tests-windows:
    name: Unit Tests (windows-2022)
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs-only PR, skipping unit tests."

  # Coverage Test and I18n Check are required status checks on main. pr-checks.yml
  # ignores '**/*.md' and 'docs/**', so on a docs-only PR they are never reported
  # and branch protection waits on them forever — the PR cannot merge at all.
  # Report them here for the same reason the unit-test jobs above are reported.
  coverage-test:
    name: Coverage Test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs-only PR, no source changes to cover."

  i18n-check:
    name: I18n Check
    runs-on: ubuntu-latest
    steps:
      # Translation data lives in *.json, which is outside this workflow's paths
      # filter, so any real i18n change runs the full pr-checks.yml instead.
      - run: echo "Docs-only PR, no i18n changes to validate."
